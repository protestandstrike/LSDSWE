<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legal Self-Defense in a Swedish Working Environment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column, one screen at a time. Progress lives on a punch card (stämpelkort) with red stamps; petrol ink for actions. Type: Familjen Grotesk (Swedish-drawn) for headings, Atkinson Hyperlegible for reading. */
:root{
  --bg:#F2F4F1; --card:#FFFFFF; --fg:#131C1B; --muted:#4F5D5B; --line:#D5DBD6;
  --blue:#0F4C63; --on-blue:#FFFFFF; --stamp:#C8402F; --on-stamp:#FFFFFF;
  --good:#1B6B43; --good-bg:#E1F1E7; --bad:#B3261E; --bad-bg:#FBE5E2; --warn-bg:#FAF0CC; --warn:#6A4F00;
  --f-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1716; --card:#162322; --fg:#E8EFEC; --muted:#A3B3AF; --line:#2A3B38;
    --blue:#7CC4DD; --on-blue:#0E1716; --stamp:#F0705D; --on-stamp:#1A0B08;
    --good:#5CCB8F; --good-bg:#12301F; --bad:#F59088; --bad-bg:#3A1816; --warn-bg:#3A3015; --warn:#F1D27A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1716; --card:#162322; --fg:#E8EFEC; --muted:#A3B3AF; --line:#2A3B38;
  --blue:#7CC4DD; --on-blue:#0E1716; --stamp:#F0705D; --on-stamp:#1A0B08;
  --good:#5CCB8F; --good-bg:#12301F; --bad:#F59088; --bad-bg:#3A1816; --warn-bg:#3A3015; --warn:#F1D27A; color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:var(--fs,100%);-webkit-text-size-adjust:100%}
h1,h2,h3,.mod-b,.mod-t,.sr>span,.qt,p,li,dd,dt,summary{overflow-wrap:anywhere;min-width:0}
h3{text-wrap:balance}
body{background:var(--bg);color:var(--fg);font:400 1.0625rem/1.6 var(--f-body);margin:0;padding-inline:16px;padding-block:18px 8rem;-webkit-tap-highlight-color:transparent}
#app{max-width:40rem;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit}
a{color:var(--blue);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
p{margin:0}
.eyebrow{font:500 .875rem/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(1.9rem,8.6vw,3rem)/1.04 var(--f-display);letter-spacing:-.03em;margin:8px 0 12px;text-wrap:balance}
h1 em{font-style:normal;color:var(--stamp)}
h2{font:700 1.9rem/1.1 var(--f-display);letter-spacing:-.02em;margin:4px 0 0;text-wrap:balance}
h3{font:600 1.3rem/1.2 var(--f-display);margin:0 0 4px;letter-spacing:-.01em}
.lede{font-size:1.125rem;color:var(--muted)}
.note{font-size:.9375rem;line-height:1.55;color:var(--muted)}
.back{align-self:flex-start;background:none;border:0;padding:10px 0;min-height:44px;font-weight:700;color:var(--blue);cursor:pointer}

/* punch card */
.punch{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;position:relative}
.punch::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;border-radius:var(--r) 0 0 var(--r);background:var(--stamp)}
.punch-h{display:flex;justify-content:space-between;gap:8px;padding-bottom:12px;border-bottom:2px dashed var(--line);padding-left:6px}
.holes{list-style:none;margin:0;padding:0 0 0 6px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hole{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--line);font:500 .8125rem var(--f-mono);color:var(--muted)}
.hole svg{width:60%;height:60%}
.hole.tried{border:2px solid var(--blue);color:var(--blue)}
.hole.on{background:var(--stamp);border:0;color:var(--on-stamp)}
.rank{display:flex;flex-direction:column;gap:2px;padding-left:6px}.belt{display:inline-block;position:relative;width:3rem;height:.8rem;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);border:1.5px solid currentColor;margin-right:10px;vertical-align:middle}.rank strong{font:600 1.5rem/1.2 var(--f-head,inherit)}.pbar{height:10px;border-radius:99px;background:var(--line);margin-left:6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--stamp);border-radius:99px}.pch{list-style:none;margin:0;padding:0 0 0 6px;display:flex;flex-direction:column;gap:6px}.pch li{display:flex;justify-content:space-between;gap:8px;font-size:.9375rem}.lk{background:none;border:0;padding:0;font:inherit;color:var(--blue);text-decoration:underline;cursor:pointer}.hs{margin:0;padding-left:1.25rem;display:flex;flex-direction:column;gap:8px}.hs li{padding-left:2px}.punch-f{font-size:.9375rem;color:var(--muted);padding-left:6px}

/* act list */
.list{display:flex;flex-direction:column;gap:10px}
.mod{display:grid;grid-template-columns:3rem 1fr auto;gap:14px;align-items:center;text-align:left;width:100%;min-height:4.5rem;padding:12px 14px 12px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.mod{box-shadow:0 1px 2px rgba(19,28,27,.06);transition:border-color .15s,box-shadow .15s,transform .1s}
.mod:hover{border-color:var(--blue);box-shadow:0 3px 10px rgba(19,28,27,.10)}
.mod:active,.opt:active,.btn:active{transform:translateY(1px)}
.mod-n{font:700 1.6rem/1 var(--f-display);background:var(--blue);color:var(--on-blue);border-radius:10px;height:3rem;display:grid;place-items:center}
.mod-b{display:flex;flex-direction:column;min-width:0;gap:2px}
.mod-b strong{font:600 1.1rem/1.25 var(--f-display)}
.mod-t{font:400 .875rem/1.4 var(--f-body);color:var(--muted)}
.badge{font:500 .875rem var(--f-mono);padding:5px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.done{background:var(--stamp);color:var(--on-stamp);border-color:transparent}
.badge.try{border-color:var(--blue);color:var(--blue)}

/* lesson */
.points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.pt{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.pt h3{font-size:1.4rem}
.pt .en{font:500 .875rem var(--f-mono);color:var(--muted)}

/* sources */
.sb{display:flex;flex-direction:column;gap:8px;font-size:.9375rem;line-height:1.5;padding-top:6px}
.sr{display:grid;grid-template-columns:7.5rem 1fr;gap:8px;align-items:start}
.tg{font:500 .8125rem/1.3 var(--f-mono);letter-spacing:.03em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:4px 6px;color:var(--muted);text-align:center}
.tg.tr{border-color:var(--blue);color:var(--blue)}
.tg.un{border-style:dashed}
.sr>span:last-child{min-width:0}
.qt{display:block;margin-top:2px;color:var(--fg);font-style:italic}
.links a{margin-right:12px;display:inline-block}
.actsrc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;font-size:.9375rem}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:.9375rem}
.sc{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--stamp);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.h2s{font-size:1.5rem;margin:2px 0 4px}
.mod2 .mod-n{background:var(--stamp);color:var(--on-stamp)}
.mod[aria-disabled="true"]{opacity:.7;cursor:not-allowed;border-style:dashed}
.mod[aria-disabled="true"] .mod-n{background:var(--line);color:var(--muted)}
.how{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.how strong{font:700 1.1rem var(--f-display)}
.disc{border:2px solid var(--stamp);border-radius:var(--r);padding:10px 14px;font-size:.875rem;line-height:1.5;background:var(--card)}
.disc strong{display:block;font:700 1rem var(--f-display);margin-bottom:2px}
.disc .disc-p{display:block;margin-top:10px}
.actd .actsrc{border:0;padding:8px 0 0;background:none}
.pt{gap:6px}
.pt p{line-height:1.55}
.can{font-size:.9375rem;line-height:1.5;border:1px dashed var(--warn);color:var(--warn);border-radius:8px;padding:8px 10px}
.can b{font-weight:700}
.srcd{border:0;border-top:1px dashed var(--line);border-radius:0;padding:6px 0 0;background:none}
.srcd>summary{font-weight:700;font-size:.9375rem;color:var(--blue);min-height:44px;display:flex;align-items:center;cursor:pointer}
.srcline{font-size:.9375rem;color:var(--muted)}

/* quiz */
.qtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:-6px;padding-block:4px}
.qcount{font:700 1.1rem var(--f-display);font-variant-numeric:tabular-nums}
.bars{display:flex;gap:5px}
.seg{flex:1;height:8px;border-radius:4px;background:var(--line)}
.seg.cur{background:var(--blue)} .seg.ok{background:var(--good)} .seg.no{background:var(--bad)}
.q{font:600 1.45rem/1.3 var(--f-display);letter-spacing:-.01em;margin:4px 0 0;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:2rem 1fr;gap:12px;align-items:start;text-align:left;width:100%;min-height:3.5rem;padding:12px;background:var(--card);border:2px solid var(--line);border-radius:var(--r);cursor:pointer;font-size:1.0625rem;line-height:1.4}
.opt:not(:disabled):hover{border-color:var(--blue)}
.opt .L{font:700 .9375rem var(--f-mono);color:var(--muted);border:2px solid var(--line);border-radius:8px;height:2rem;display:grid;place-items:center}
.opt.ok{border-color:var(--good);background:var(--good-bg)} .opt.ok .L{background:var(--good);color:var(--card);border-color:transparent}
.opt.no{border-color:var(--bad);background:var(--bad-bg)} .opt.no .L{background:var(--bad);color:var(--card);border-color:transparent}
.opt.dim{opacity:.8}
.opt:disabled{cursor:default;color:var(--fg)}
.fb{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;border:2px solid}
.fb:focus{outline:none}
.fb.ok{background:var(--good-bg);border-color:var(--good)} .fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb-h{display:flex;align-items:center;gap:10px}
.fb-h strong{font:700 1.4rem/1 var(--f-display)}
.fb.ok .fb-h{color:var(--good)} .fb.no .fb-h{color:var(--bad)}
.fb-ic{width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;background:currentColor}
.fb-ic svg{width:60%;height:60%;color:var(--card)}
.fb .tg{background:var(--card)}
.fb .srcd{border-top-color:currentColor;opacity:1}

/* result */
.score{display:flex;align-items:center;gap:22px;padding:10px 4px}
.score-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.score-t h2{font-size:1.5rem;margin:0}
.big{font:700 3.8rem/.95 var(--f-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stamp{flex:none;width:5.5rem;height:5.5rem;border-radius:50%;background:var(--stamp);color:var(--on-stamp);display:grid;place-items:center;transform:rotate(-8deg);box-shadow:0 0 0 6px var(--bg),0 0 0 8px var(--stamp);animation:thump .45s cubic-bezier(.2,1.4,.4,1) both}
.stamp.miss{background:none;border:3px dashed var(--line);color:var(--muted);box-shadow:none;animation:none;transform:none}
@keyframes thump{from{transform:scale(1.7) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
details{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
summary{cursor:pointer;font-weight:700;min-height:44px}
.ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.9375rem}
.rev{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.rev>div{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.rev b{font-weight:700}

/* glossary */
dl{margin:0;display:flex;flex-direction:column;gap:10px}
.gl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.gl dt{font:600 1.4rem/1.15 var(--f-display)}
.gl dt span{font:500 .875rem var(--f-mono);color:var(--muted);margin-left:8px;letter-spacing:0}
.gl dd{margin:0}

/* controls */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:40rem;margin-inline:auto;display:flex;gap:10px}
.btn{flex:1;min-height:3.5rem;border-radius:12px;border:2px solid transparent;font:700 1.0625rem var(--f-body);cursor:pointer;padding:0 16px}
.btn.pri{background:var(--blue);color:var(--on-blue)}
.btn.sec{background:transparent;border-color:var(--line)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.aa{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:99px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;color:var(--fg)}
.aa:hover{border-color:var(--blue)}
.aa>span:first-child{font:700 1.15rem/1 var(--f-display)}
.aa small{font-size:.8em}
.aa-l{font:500 .875rem var(--f-mono);color:var(--muted)}
.size{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.size span{font-weight:700;font-size:.9375rem;margin-right:4px}
.size button{min-width:44px;min-height:44px;padding:0 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:700}
.size button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue);color:var(--on-blue)}
@media (max-width:380px){.sr{grid-template-columns:1fr}.tg{justify-self:start}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
.srcd a,.links a{display:inline-block;padding:11px 4px}
.cmp{display:grid;gap:10px;margin:16px 0}
.cmp-r{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:12px 14px;display:grid;gap:6px}
.cmp-r strong{font:700 1rem var(--f-display)}
.cmp-c{display:grid;grid-template-columns:4.6rem 1fr;gap:8px;align-items:baseline;font-size:.9375rem}
.cmp-l{font:500 .8125rem var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.cmp-w .cmp-l{color:var(--blue)}
.catag{display:inline-flex;align-items:center;gap:8px;margin:12px 0 -4px;padding:5px 10px 5px 6px;border:1.5px solid var(--blue);border-radius:99px;font-size:.875rem;font-weight:700;color:var(--blue);background:var(--card);line-height:1.3}
.catag-i{display:inline-grid;place-items:center;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--blue);color:var(--on-blue);font-size:.8rem;flex:none}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

html{scroll-padding-bottom:9rem}
details.chap>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:6px 0}
details.chap>summary::-webkit-details-marker{display:none}
details.chap>summary .chev{font-size:1.2rem;transition:transform .15s}
details.chap[open]>summary .chev{transform:rotate(90deg)}
details.chap .list{margin-top:10px}
.mod.next{border:2px solid var(--stamp)}
.badge.nx{background:var(--stamp);color:var(--on-stamp)}
.pick{font-size:.9375rem;margin:0 0 6px}
.learned{display:flex;flex-direction:column;gap:6px}
.gtools{display:flex;flex-direction:column;gap:10px}
.gtools input{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);width:100%;box-sizing:border-box}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:500 .875rem var(--f-body);padding:6px 10px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;min-height:44px}
.chips button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.az{display:flex;flex-wrap:wrap;gap:4px}
.az button{font:600 .875rem var(--f-mono);min-width:44px;min-height:44px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.hs label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.hs input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--blue)}
.hs input:checked+span{text-decoration:line-through;opacity:.65}
.hs{list-style:none;padding-left:0}
.danger{color:var(--stamp)}
.gl[hidden]{display:none!important}
.glass{width:100%;padding:6px;border:0;border-radius:var(--r);background:var(--stamp);cursor:pointer;font:inherit;text-align:left}
.glass-in{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:calc(var(--r) - 4px);border:2px dashed var(--on-stamp);color:var(--on-stamp);background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,255,255,.08) 14px 16px)}
.glass-in strong{display:block;font:700 1.125rem/1.25 var(--f-display)}
.glass-in small{display:block;font-size:.875rem;opacity:.9;margin-top:2px}
.glass:hover .glass-in,.glass:focus-visible .glass-in{border-style:solid}
</style>
</head>

    {t:"Who is not covered",sv:"Undantag",d:"2 § lists exceptions, for example household work, senior executives and employees who control their own working time.",s:"2 §"},
    {t:"On-call duty",sv:"Jourtid",d:"On-call duty at the workplace is allowed when operations require it: at most 48 hours over four weeks or 50 hours in a calendar month.",s:"6 §",q:"får jourtid tas ut med högst 48 timmar"},
    {t:"Overtime per period",sv:"Allmän övertid",d:"General overtime for special needs is limited to 48 hours over four weeks or 50 hours in a calendar month, besides the yearly cap in 8 §.",s:"8 §",q:"får övertid tas ut med högst 48 timmar per arbetstagare"},
    {t:"Extra overtime",sv:"Extra övertid",d:"For special reasons, up to 150 hours a year beyond general overtime. The four-week and monthly limits still apply.",s:"8 a §",q:"Övertid utöver allmän övertid får tas ut med högst 150 timmar"},
    {t:"Schedules",sv:"Schema",d:"Changes to ordinary and on-call time must be notified at least two weeks ahead, unless shorter notice is justified.",s:"12 §",q:"minst två veckor i förväg"},
    {t:"Night",sv:"Natt",d:"Night means 22:00 to 06:00. Night workers have extra limits on daily working time.",s:"13 a §",q:"Med natt avses perioden mellan klockan 22 och klockan 6"}
  ],
  qs:[
    {q:"By law, what is the maximum ordinary working time per week?",a:"40 hours",w:["35 hours","45 hours","48 hours"],e:"Ordinary working time may be at most 40 hours per week.",s:"5 §",sv:"högst 40 timmar i veckan"},
    {q:"By law, what is the cap on general overtime per calendar year?",a:"200 hours",w:["50 hours","100 hours","400 hours"],e:"General overtime may not exceed 200 hours in a calendar year.",s:"8 §",sv:"högst 200 timmar under ett kalenderår"},
    {q:"By law, how much unbroken rest must you get every 24 hours?",a:"At least 11 hours",w:["At least 8 hours","At least 9 hours","At least 12 hours"],e:"This is the daily rest (dygnsvila).",s:"13 §",sv:"minst elva timmars sammanhängande ledighet"},
    {q:"By law, how much continuous weekly rest (veckovila) must you get within every seven days?",a:"At least 36 hours",w:["At least 24 hours","At least 48 hours","At least 72 hours"],e:"The weekly rest is 36 consecutive hours in every seven-day period.",s:"14 §",sv:"minst trettiosex timmars sammanhängande ledighet"},
    {q:"How many hours in a row can you work without a break?",a:"Five hours",w:["Three hours","Six hours","Eight hours"],e:"The Act requires breaks (raster) so that you do not work more than five hours in a row.",s:"15 §",sv:"mer än fem timmar i följd"},
    {q:"By law, how much on-call duty (jourtid) at the workplace may an employer order?",a:"At most 48 hours per four weeks",w:["At most 10 hours a year","At most 100 hours a week","There is no limit"],e:"On-call duty at the workplace is allowed when operations require it.",s:"6 §",sv:"får jourtid tas ut med högst 48 timmar"},
    {q:"By law, how much general overtime may be ordered per employee over four weeks for special needs?",a:"At most 48 hours",w:["At most 10 hours","At most 100 hours","At most 150 hours"],e:"The yearly cap of 200 hours in 8 § applies on top of these period limits.",s:"8 §",sv:"får övertid tas ut med högst 48 timmar per arbetstagare"},
    {q:"By law, how much extra övertid is allowed per year, on top of general overtime?",a:"Up to 150 hours",w:["Up to 50 hours","Up to 400 hours","None"],e:"The four-week and monthly limits still apply to the combined overtime.",s:"8 a §",sv:"Övertid utöver allmän övertid får tas ut med högst 150 timmar"},
    {q:"By law, how far ahead must you be told about changes to your hours?",a:"At least two weeks",w:["At least one day","At least two months","Never. The employer can change them at any time"],e:"The same rule covers on-call time.",s:"12 §",sv:"minst två veckor i förväg"},
    {q:"Which hours count as night under the Act?",a:"22:00 to 06:00",w:["20:00 to 04:00","23:00 to 05:00","00:00 to 06:00"],e:"Night workers have extra limits on daily working time.",s:"13 a §",sv:"Med natt avses perioden mellan klockan 22 och klockan 6"},
    {q:"You finish work at 22:00. By law, what is the earliest start next morning that still gives you the daily rest?",a:"09:00",w:["07:00", "08:00", "10:00"],e:"You need at least 11 hours of continuous rest in every 24 hours. 22:00 plus 11 hours is 09:00.",s:"13 §",sv:null,eq:null},
    {q:"True or false: by law, standby time at home counts toward your weekly rest.",a:"False",w:["True"],e:"Standby time at home does not count toward the 36 hours of weekly rest.",s:"14 §",sv:null,eq:null},
    {q:"Which statement about the Working Hours Act is NOT correct?",a:"The Act sets a fixed extra rate of pay for overtime",w:["Ordinary working time is at most 40 hours a week", "You get at least 11 hours of rest every 24 hours", "Breaks must come before you work five hours in a row"],e:"The Act sets time limits but has no pay rules for overtime. Pay comes from your collective agreement or employment contract.",s:"8 §",sv:null,eq:null},
    {q:"True or false: overtime may be scheduled in advance as a regular part of your hours.",a:"False",w:["True"],e:"General overtime is for a special need. It cannot become a regular, recurring part of your working time.",s:"8 §",sv:null,eq:null}
  ]
},
{
  k:"LAS",title:"Employment Protection Act",full:"Employment Protection Act",sfs:"1982:80",sv:"Lag om anställningsskydd (LAS)",r:"lag-198280-om-anstallningsskydd_sfs-1982-80",svTo:"SFS 2022:836",en:null,
  intro:"How employment starts, what you must be told in writing, and what an employer needs to end a job.",
  lesson:[
    {t:"Permanent by default",sv:"Tillsvidareanställning",d:"A contract runs until further notice. Fixed terms are allowed only in the cases listed in 5 and 6 §§.",s:"4 §",q:"tills vidare"},
    {t:"Fixed-term forms",sv:"Visstidsanställning",d:"Allowed for special fixed-term employment (särskild visstidsanställning), substitute work (vikariat) and seasonal work (säsongsarbete).",s:"5 §"},
    {t:"Probation",sv:"Provanställning",d:"The probation period may be at most six months. If neither side ends it by the end of the period, it becomes permanent.",s:"6 §",q:"högst sex månader"},
    {t:"Terms in writing",sv:"Skriftlig information",d:"Core items must be given no later than the seventh calendar day after you start. Some other items may follow within one month.",s:"6 c §",q:"senast den sjunde kalenderdagen"},
    {t:"Reason for termination",sv:"Sakliga skäl",d:"An employer's termination must rest on objective grounds: shortage of work (arbetsbrist) or reasons personal to you. It is not justified if reasonable other work with the same employer could be offered.",s:"7 §",q:"sakliga skäl"},
    {t:"Notice period",sv:"Uppsägningstid",d:"At least one month. It grows with years employed: two months from two years, three from four, four from six, five from eight, six from ten.",s:"11 §"},
    {t:"Fixed-term becomes permanent",sv:"Konvertering",d:"A särskild visstidsanställning becomes permanent after more than 12 months in total within five years, or after more than 12 months of back-to-back fixed-term jobs. A vikariat does after more than two years in total within five years.",s:"5 a §",q:"i sammanlagt mer än tolv månader"},
    {t:"Termination in writing",sv:"Skriftlig uppsägning",d:"An employer's notice must be in writing. It must say how to challenge it or claim damages, and whether you have rehiring priority. It is given to you personally where possible.",s:"8 §",q:"Uppsägning från arbetsgivarens sida skall vara skriftlig."},
    {t:"Order of termination",sv:"Turordning",d:"In a redundancy, employees with longer employment time have priority over those with shorter. Ties go to the older employee. A few key employees can be exempted.",s:"22 §",q:"Arbetstagare med längre anställningstid har företräde framför arbetstagare med kortare anställningstid"},
    {t:"Rehiring priority",sv:"Företrädesrätt",d:"After a redundancy you can have priority to be rehired until nine months after the employment ended. This needs more than 12 months of employment in the last three years (or more than nine months of särskild visstidsanställning).",s:"25 §",q:"till dess nio månader har förflutit från den dag då anställningen upphörde"},
    {t:"Warning before termination",sv:"Varsel",d:"Before an ordinary termination for personal reasons, the employer must give two weeks' notice and tell the local union at the same time. Before a dismissal (avsked) it is one week.",s:"30 §"}
  ],
  qs:[
    {q:"Under the Employment Protection Act, what is the default form of employment?",a:"Permanent employment",w:["A fixed 12-month contract","A six-month probation","Fixed-term employment"],e:"A contract runs until further notice unless the law allows a fixed term. Fixed terms are allowed only in the cases listed in 5 and 6 §§.",s:"4 §",sv:"tills vidare"},
    {q:"What is the longest a probationary employment (provanställning) can be?",a:"Six months",w:["Three months","12 months","Two years"],e:"The probation period may be at most six months. If neither side ends it by then, it becomes permanent.",s:"6 §",sv:"högst sex månader"},
    {q:"When must you get your main job terms in writing?",a:"By the seventh day after you start",w:["After the first month","After the first year","Only if you ask for it"],e:"Core items are due by day seven. Some other items may follow within one month.",s:"6 c §",sv:"senast den sjunde kalenderdagen"},
    {q:"What must a termination by the employer rest on?",a:"Objective grounds (sakliga skäl)",w:["Whatever the employer decides","A warning from the union","Permission from Arbetsmiljöverket"],e:"A termination is not justified if it would be reasonable to offer you other work with the same employer.",s:"7 §",sv:"sakliga skäl"},
    {q:"By law, what is the minimum notice period once you have been employed for at least ten years?",a:"Six months",w:["One month","Three months","12 months"],e:"The minimum is one month. It grows with years employed: two months from two years, three from four, four from six, five from eight and six from ten.",s:"11 §",sv:null},
    {q:"By law, when does a särskild visstidsanställning become permanent?",a:"After more than 12 months",w:["After more than 3 months","After more than 6 months","After more than 3 years"],e:"A vikariat (substitute job) becomes permanent after more than two years in total within five years.",s:"5 a §",sv:"i sammanlagt mer än tolv månader"},
    {q:"How must an employer give you notice of termination?",a:"In writing",w:["Verbally is enough","By text message only","Through the union only"],e:"The notice must say how to challenge it or claim damages, and whether you have rehiring priority.",s:"8 §",sv:"Uppsägning från arbetsgivarens sida skall vara skriftlig."},
    {q:"By law, who has priority to keep their job in a redundancy under the order-of-termination rule?",a:"Employees with longer employment time",w:["Employees with shorter employment time","The youngest employees","Union members"],e:"Ties go to the older employee. A few key employees can be exempted.",s:"22 §",sv:"Arbetstagare med längre anställningstid har företräde framför arbetstagare med kortare anställningstid"},
    {q:"By law, for how long after a redundancy can you have priority to be rehired?",a:"Nine months",w:["One month","Three months","Five years"],e:"This needs more than 12 months of employment in the last three years. For särskild visstidsanställning it is nine months.",s:"25 §",sv:"till dess nio månader har förflutit från den dag då anställningen upphörde"},
    {q:"How much advance warning must the employer give before an ordinary termination for personal reasons?",a:"Two weeks",w:["No warning is needed","One day","Two months"],e:"Before a dismissal (avsked) the warning is one week.",s:"30 §",sv:null},
    {q:"You have worked five years for the same employer and are terminated for redundancy. By law, what is your minimum notice period?",a:"Three months",w:["One month", "Two months", "Five months"],e:"With at least four but under six years of employment, the notice period is at least three months.",s:"11 §",sv:null,eq:null},
    {q:"True or false: a probationary employment becomes permanent if nobody ends it by the end of the six months.",a:"True",w:["False"],e:"If neither side ends the probation by the end of the period, it becomes permanent employment.",s:"6 §",sv:null,eq:null},
    {q:"In a redundancy, which rule does the law use as the main starting point for the order of termination?",a:"Last in, first out",w:["First in, first out", "Youngest first", "Highest paid first"],e:"Employees with longer employment time keep their jobs first, if they are qualified for the work left. A few key employees can be exempted.",s:"22 §",sv:null,eq:null},
    {q:"By law, how long must you have worked for the employer in the last three years to get priority to be rehired?",a:"More than 12 months",w:["More than 3 months", "More than 6 months", "More than 24 months"],e:"You need more than 12 months of employment in the last three years. The priority runs until nine months after the job ended.",s:"25 §",sv:null,eq:null}
  ]
},
{
  k:"MBL",title:"Co-Determination Act",full:"Co-Determination Act",sfs:"1976:580",sv:"Lag om medbestämmande i arbetslivet (MBL)",r:"lag-1976580-om-medbestammande-i-arbetslivet_sfs-1976-580",svTo:"SFS 2026:886",en:EN_MBL,
  intro:"The rules of the Swedish model: organising, negotiating, collective agreements and industrial action.",
  lesson:[
    {t:"Right of association",sv:"Föreningsrätt",d:"The right of employers and employees to belong to an employers' or employees' organisation.",s:"7 §",q:"Med föreningsrätt avses rätt för arbetsgivare och arbetstagare att tillhöra",eq:"the right of employers and employees to belong to an employers' organisation or an employees' organisation"},
    {t:"No infringement",sv:"Okränkt",d:"The right of association may not be infringed.",s:"8 §",q:"Föreningsrätten skall lämnas okränkt.",eq:"The right of association may not be infringed."},
    {t:"Right to negotiate",sv:"Förhandlingsrätt",d:"A union may negotiate with an employer on matters about the employer's relationship with a union member. The employer has an equivalent right.",s:"10 §",q:"Arbetstagarorganisation har rätt till förhandling med arbetsgivare",eq:"An employees' organisation shall have the right to negotiate with an employer"},
    {t:"Negotiate before big changes",sv:"Primär förhandlingsskyldighet",d:"Before deciding significant changes in its activities, an employer must on its own initiative negotiate with the union it is bound to under a collective agreement.",s:"11 §",q:"Innan arbetsgivare beslutar om viktigare förändring av sin verksamhet",eq:"Before an employer takes any decision regarding significant changes in its activities"},
    {t:"Information",sv:"Informationsplikt",d:"An employer must regularly inform the union about production, finances and personnel policy.",s:"19 §",q:"Arbetsgivare skall fortlöpande hålla arbetstagarorganisation",eq:"An employer is obliged to regularly inform an employees' organisation"},
    {t:"Collective agreement",sv:"Kollektivavtal",d:"A written agreement between an employer or employers' organisation and a union.",s:"23 §",q:"Med kollektivavtal avses skriftligt avtal mellan arbetsgivarorganisation eller arbetsgivare",eq:"an agreement in writing between an employers' organisation or an employer and an employees' organisation"},
    {t:"Peace obligation",sv:"Fredsplikt",d:"Parties may not start or join a stoppage of work, blockade or boycott in the situations listed, for example to bring about an amendment to the agreement.",s:"41 §",q:"får inte vidta eller delta i arbetsinställelse",eq:"may not initiate or participate in a stoppage of work (lockout or strike), blockade, boycott"},
    {t:"Notice of action",sv:"Varsel",d:"Written notice to the other party and the National Mediation Office at least seven working days in advance.",s:"45 §",q:"minst sju arbetsdagar i förväg",eq:"shall give written notice to the other party and the National Mediation Office at least seven working days in advance"},
    {t:"Local union first",sv:"Förhandling lokalt",d:"Where a local union exists, negotiation goes to it first. If there is no agreement, the central union can be included on request.",s:"14 §",q:"Uppnås icke enighet vid förhandling",eq:"the obligation to negotiate under Sections 11 - 13 shall, in the first instance, be fulfilled"},
    {t:"Meeting deadline",sv:"Förhandlingssammanträde",d:"A negotiation meeting must generally be held within two weeks if the other party is an individual employer or a local union, and within three weeks otherwise. Cases under 11 to 13 §§ are excluded.",s:"16 §",q:"sammanträde för förhandling hållas inom två veckor",eq:"be held within two weeks of receipt by the other party of a demand for negotiations"},
    {t:"Who is bound",sv:"Bundenhet",d:"An agreement binds members of the signing organisations within its scope, whether they joined before or after it was made. Leaving the organisation does not end the effect. In practice, the employer must apply the agreement to everyone in the roles it covers, union members or not.",s:"26 §",q:"binder inom sitt tillämpningsområde även medlem i organisationen",eq:"shall also be binding, within its area of applicability, upon a member of such organisation"},
    {t:"Hiring in outsiders",sv:"Utomstående arbetskraft",d:"Before an employer lets someone who is not an employee do certain work, it must negotiate with the bound union. Short-term work and work needing special skills are exempt.",s:"38 §",q:"på eget initiativ förhandla med den arbetstagarorganisation",eq:"Before an employer decides to allow a particular person to perform certain work on his behalf"},
    {t:"Mediation",sv:"Medlingsinstitutet",d:"The National Mediation Office mediates labour disputes between employers and unions and works for well-functioning wage formation.",s:"46 §",q:"Institutet ska verka för en väl fungerande lönebildning",eq:"exists to mediate in industrial disputes between an employer or employers' organisation"}
  ],
  qs:[
    {q:"What does the right of association (föreningsrätt) mean?",a:"The right to belong to a union or similar",w:["The employer's right to choose which union you join","The right to a pay rise every year","A rule that all employees must join a union"],e:"Section 8 adds that the right of association may not be infringed.",s:"7 §",sv:"rätt för arbetsgivare och arbetstagare att tillhöra arbetsgivar- eller arbetstagarorganisation",eq:"the right of employers and employees to belong to an employers' organisation or an employees' organisation"},
    {q:"An employer plans a significant change in its activities. What must it do before deciding?",a:"Negotiate with the union first",w:["Ask Arbetsmiljöverket for permission","Announce it and wait for objections","Hold a vote among all employees"],e:"The duty applies to the union the employer is bound to negotiate with under a collective agreement.",s:"11 §",sv:"Innan arbetsgivare beslutar om viktigare förändring av sin verksamhet",eq:"Before an employer takes any decision regarding significant changes in its activities … he shall, on its own initiative, enter into negotiations"},
    {q:"What is a collective agreement (kollektivavtal)?",a:"A written deal between employers and a union",w:["A law passed by the Riksdag","A contract between one employee and their manager","A list of rules the employer writes alone"],e:"The Act defines it as a written agreement between the employer side and an employees' organisation.",s:"23 §",sv:"Med kollektivavtal avses skriftligt avtal mellan arbetsgivarorganisation eller arbetsgivare",eq:"an agreement in writing between an employers' organisation or an employer and an employees' organisation"},
    {q:"What does fredsplikt stop the parties to a collective agreement from doing?",a:"Taking part in a strike or lockout",w:["Negotiating with the other side","Asking the employer for information","Joining a union"],e:"One listed situation is action to bring about an amendment to the agreement.",s:"41 §",sv:"får inte vidta eller delta i arbetsinställelse",eq:"may not initiate or participate in a stoppage of work (lockout or strike), blockade, boycott"},
    {q:"How much written notice must be given before a strike, lockout or similar action?",a:"Seven working days",w:["No notice is needed","24 hours","30 days"],e:"The notice goes to the other party and to the National Mediation Office (Medlingsinstitutet).",s:"45 §",sv:"minst sju arbetsdagar i förväg",eq:"shall give written notice to the other party and the National Mediation Office at least seven working days in advance"},
    {q:"By law, where there is a local union, who does the employer negotiate with first?",a:"The local union",w:["The central union","The National Mediation Office","The Labour Court"],e:"If there is no agreement, the central union can be included on request.",s:"14 §",sv:"Uppnås icke enighet vid förhandling",eq:"the obligation to negotiate under Sections 11 - 13 shall, in the first instance, be fulfilled"},
    {q:"A local union asks to negotiate. How soon must the meeting normally be held?",a:"Within two weeks",w:["Within two days","Within two months","Within one year"],e:"Three weeks apply in other cases. The parties may agree otherwise, and cases under 11 to 13 §§ are excluded.",s:"16 §",sv:"sammanträde för förhandling hållas inom två veckor",eq:"be held within two weeks of receipt by the other party of a demand for negotiations"},
    {q:"Who does a collective agreement bind?",a:"Members of the organisations that signed it",w:["Only the people who signed it personally","Every employee in the sector","Only the union's board"],e:"Members already bound by another agreement are not bound by this one. Leaving the organisation does not end the effect. In practice, the employer must apply the agreement to everyone in the roles it covers, union members or not.",s:"26 §",sv:"binder inom sitt tillämpningsområde även medlem i organisationen",eq:"shall also be binding, within its area of applicability, upon a member of such organisation"},
    {q:"Before an employer lets a non-employee do certain work, what must it do?",a:"Negotiate with the union first",w:["Ask Arbetsmiljöverket for a permit","Advertise the work publicly","Nothing"],e:"Work needing special skills is also exempt. Urgent cases allow the employer to act first.",s:"38 §",sv:"på eget initiativ förhandla med den arbetstagarorganisation",eq:"Before an employer decides to allow a particular person to perform certain work on his behalf"},
    {q:"Which body mediates labour disputes between employers and unions?",a:"Medlingsinstitutet",w:["Arbetsmiljöverket","Diskrimineringsombudsmannen","Försäkringskassan"],e:"It also works for well-functioning wage formation.",s:"46 §",sv:"Institutet ska verka för en väl fungerande lönebildning",eq:"exists to mediate in industrial disputes between an employer or employers' organisation"},
    {q:"True or false: written notice of a strike must also go to the National Mediation Office.",a:"True",w:["False"],e:"Notice of a strike, lockout or similar action goes to the other party and to Medlingsinstitutet, at least seven working days ahead.",s:"45 §",sv:null,eq:null},
    {q:"Which statement about collective agreements is NOT correct?",a:"They bind everyone living in Sweden",w:["They are written agreements", "They bind members of the signing organisations in their scope", "Leaving the organisation does not end the effect"],e:"A collective agreement binds only the members of the signing organisations within its scope. In practice, the employer must apply the agreement to everyone in the roles it covers, union members or not.",s:"26 §",sv:null,eq:null},
    {q:"The other side is not a private employer or a local union. How soon must a negotiation meeting normally be held?",a:"Within three weeks",w:["Within one week", "Within five weeks", "Within ten weeks"],e:"The general rule is two weeks if the other side is a private employer or local union, and three weeks otherwise.",s:"16 §",sv:null,eq:null},
    {q:"True or false: parties bound by a collective agreement may start a boycott over a dispute about how the agreement should be read.",a:"False",w:["True"],e:"The peace obligation bars strikes, lockouts, blockades and boycotts used to press a dispute about the agreement or how to read it.",s:"41 §",sv:null,eq:null}
  ]
},
{
  k:"AML",title:"Work Environment Act",full:"Work Environment Act",sfs:"1977:1160",sv:"Arbetsmiljölag",r:"arbetsmiljolag-19771160_sfs-1977-1160",svTo:"SFS 2026:1001",en:null,
  intro:"Who is responsible for a safe workplace, who represents staff on safety and who supervises it.",
  lesson:[
    {t:"A satisfactory environment",sv:"Tillfredsställande arbetsmiljö",d:"The work environment must be satisfactory given the nature of the work and social and technical developments.",s:"2 kap. 1 §",q:"Arbetsmiljön skall vara tillfredsställande"},
    {t:"Employer's duty",sv:"Arbetsgivarens ansvar",d:"The employer must take all measures needed to prevent ill health and accidents. Risks should first be changed or replaced.",s:"3 kap. 2 §",q:"vidta alla åtgärder som behövs för att förebygga"},
    {t:"Skyddsombud",sv:"Safety representative",d:"Workplaces with at least five regular employees must have one. A local union with a collective agreement appoints. If none exists, the employees do.",s:"6 kap. 2 §",q:"minst fem arbetstagare regelbundet sysselsätts"},
    {t:"Access to information",sv:"Rätt till handlingar",d:"A skyddsombud may take part of the documents and information needed for the assignment.",s:"6 kap. 6 §",q:"rätt att taga del av de handlingar"},
    {t:"Stopping dangerous work",sv:"Avbryta arbetet",d:"If work poses immediate and serious danger to life or health and it cannot be fixed quickly with the employer, the skyddsombud may stop it until Arbetsmiljöverket has taken a position.",s:"6 kap. 7 §",q:"omedelbar och allvarlig fara för arbetstagares liv eller hälsa"},
    {t:"Supervision",sv:"Tillsyn",d:"Arbetsmiljöverket supervises that the Act and its regulations are followed.",s:"7 kap. 1 §",q:"Arbetsmiljöverket utövar tillsyn över att denna lag"},
    {t:"Purpose",sv:"Lagens ändamål",d:"The Act aims to prevent ill health and accidents at work and to achieve a good work environment.",s:"1 kap. 1 §",q:"Lagens ändamål är att förebygga ohälsa och olycksfall i arbetet"},
    {t:"Systematic work",sv:"Systematiskt arbetsmiljöarbete",d:"The employer must systematically plan, lead and control operations, investigate injuries, assess risks, schedule fixes and document the work when needed.",s:"3 kap. 2 a §",q:"Arbetsgivaren ska systematiskt planera, leda och kontrollera verksamheten"},
    {t:"Employees' part",sv:"Arbetstagarens medverkan",d:"Employees must take part in the work environment effort, follow the rules, use protective equipment and report immediate serious danger.",s:"3 kap. 4 §",q:"Arbetstagaren skall medverka i arbetsmiljöarbetet"},
    {t:"Safety committee",sv:"Skyddskommitté",d:"Required where at least 50 employees work regularly. Also at smaller workplaces if staff request it.",s:"6 kap. 8 §",q:"minst femtio arbetstagare regelbundet sysselsätts"},
    {t:"Minors",sv:"Minderårig",d:"A minor is anyone who has not turned 18.",s:"5 kap. 1 §",q:"Med minderårig avses i denna lag den som icke har fyllt aderton år."}
  ],
  qs:[
    {q:"Who must take all measures needed to prevent ill health and accidents at work?",a:"The employer",w:["The employee","The skyddsombud","Arbetsmiljöverket"],e:"The employer carries the duty. Anything that can cause risk should first be changed or replaced.",s:"3 kap. 2 §",sv:"vidta alla åtgärder som behövs för att förebygga"},
    {q:"What standard does the Act set for the work environment?",a:"It must be satisfactory for the work done",w:["It must be the cheapest option available","It must match the average in the sector","It only has to meet the employee's own wishes"],e:"This is the basic rule of the Act.",s:"2 kap. 1 §",sv:"Arbetsmiljön skall vara tillfredsställande"},
    {q:"From how many regularly employed workers must a workplace have a skyddsombud?",a:"Five",w:["Two","Ten","Fifty"],e:"A local union with a collective agreement normally appoints. If there is none, the employees appoint.",s:"6 kap. 2 §",sv:"minst fem arbetstagare regelbundet sysselsätts"},
    {q:"Work poses immediate and serious danger to life or health and cannot be fixed quickly. What may a skyddsombud do?",a:"Stop it until the authority decides",w:["Nothing. Only the employer can stop work","Wait three weeks, then report it","Stop the work only with a doctor's note"],e:"The employer is first given the chance to fix the danger quickly. If that fails, the skyddsombud can stop the work.",s:"6 kap. 7 §",sv:"omedelbar och allvarlig fara för arbetstagares liv eller hälsa"},
    {q:"Which authority supervises that the Work Environment Act is followed?",a:"Arbetsmiljöverket",w:["Försäkringskassan","Skatteverket","Diskrimineringsombudsmannen"],e:"The authority supervises both the Act and the regulations issued under it. Ship work is mostly excluded.",s:"7 kap. 1 §",sv:"Arbetsmiljöverket utövar tillsyn över att denna lag"},
    {q:"What is the purpose of the Work Environment Act?",a:"To prevent ill health and accidents",w:["To set pay levels for dangerous jobs","To regulate working hours","To replace collective agreements"],e:"This is the first rule of the Act.",s:"1 kap. 1 §",sv:"Lagens ändamål är att förebygga ohälsa och olycksfall i arbetet"},
    {q:"What does systematic work environment management require of the employer?",a:"To plan and check work to avoid risks",w:["Only to react after Arbetsmiljöverket gives an order","To leave it all to the skyddsombud","To inspect once when the business starts"],e:"Fixes are scheduled and the work is documented when needed.",s:"3 kap. 2 a §",sv:"Arbetsgivaren ska systematiskt planera, leda och kontrollera verksamheten"},
    {q:"What does the Act require of employees?",a:"To follow safety rules and take part",w:["Nothing. Only the employer has duties","To pay for their own protective equipment","To inspect the workplace every month"],e:"Employees must also report immediate serious danger.",s:"3 kap. 4 §",sv:"Arbetstagaren skall medverka i arbetsmiljöarbetet"},
    {q:"From how many regularly employed workers is a safety committee (skyddskommitté) required?",a:"Fifty",w:["Five","Ten","Twenty"],e:"It is also required at smaller workplaces if staff request it.",s:"6 kap. 8 §",sv:"minst femtio arbetstagare regelbundet sysselsätts"},
    {q:"Under the Act, who counts as a minor (minderårig)?",a:"Anyone under 18",w:["Anyone under 15","Anyone under 16","Anyone under 21"],e:"Separate rules in the Act restrict work by minors.",s:"5 kap. 1 §",sv:"Med minderårig avses i denna lag den som icke har fyllt aderton år."},
    {q:"A workplace has seven regularly employed workers. Must it have a skyddsombud?",a:"Yes, from five workers",w:["No, only from ten workers", "No, only from fifty workers", "No, only if the staff ask"],e:"Workplaces with at least five regularly employed workers must appoint a safety representative.",s:"6 kap. 2 §",sv:null,eq:null},
    {q:"True or false: you are liable for damage if you stop work in immediate, serious danger while waiting for instructions.",a:"False",w:["True"],e:"Employees are not liable for damage caused by refusing to continue work in immediate, serious danger while they wait for instructions.",s:"3 kap. 4 §",sv:null,eq:null},
    {q:"Which of these is NOT a duty of the employer?",a:"Setting extra pay for dangerous jobs",w:["Preventing ill health and accidents", "Investigating work injuries", "Assessing risks continuously"],e:"The Act requires prevention, systematic management, injury investigation and risk assessment. It does not set pay.",s:"3 kap. 2 a §",sv:null,eq:null},
    {q:"Whom must the employer notify without delay about a death or a serious work injury?",a:"Arbetsmiljöverket",w:["Försäkringskassan", "Skatteverket", "The local union"],e:"The employer must notify the authority without delay of deaths and serious injuries linked to work.",s:"3 kap. 3 a §",sv:null,eq:null}
  ]
},
{
  k:"SEM",title:"Annual Leave Act",full:"Annual Leave Act",sfs:"1977:480",sv:"Semesterlag",r:"semesterlag-1977480_sfs-1977-480",svTo:"SFS 2014:424",en:null,
  intro:"How many leave days you get, when you can take them and how holiday pay is worked out.",
  lesson:[
    {t:"The leave year",sv:"Semesterår",d:"Runs from 1 April to 31 March. The period just before it is the earning year (intjänandeår).",s:"3 §",q:"från och med den 1 april ett år till och med den 31 mars påföljande år"},
    {t:"25 days",sv:"Semesterdagar",d:"25 leave days every leave year. If you start after 31 August in the leave year, you get five.",s:"4 §",q:"tjugofem semesterdagar varje semesterår"},
    {t:"Short jobs",sv:"Kortare anställning",d:"For employment expected to last no more than three months, the parties may agree that no leave is scheduled. You then get holiday compensation instead.",s:"5 §"},
    {t:"Notice of leave",sv:"Underrättelse",d:"When leave is scheduled other than by agreement, the employer must notify you at least two months ahead. With special reasons it may be later.",s:"11 §",q:"senast två månader före ledighetens början"},
    {t:"Four weeks in summer",sv:"Sammanhängande ledighet",d:"Unless otherwise agreed, you get at least four weeks in June to August.",s:"12 §",q:"minst fyra veckor under juni-augusti"},
    {t:"Holiday pay",sv:"Semesterlön",d:"Under the percentage rule (procentregeln), holiday pay is 12 percent of the pay earned in the earning year.",s:"16 b §"},
    {t:"Not in notice period",sv:"Uppsägningstid",d:"Leave may not be scheduled during your notice period without your consent. This does not apply if the notice period is longer than six months.",s:"14 §",q:"Semesterledighet får inte utan arbetstagarens medgivande förläggas till uppsägningstid."},
    {t:"Sick during leave",sv:"Sjukdom under ledighet",d:"If you fall sick during leave and promptly ask, those days do not count as leave days. The rest of the leave is then taken together.",s:"15 §",q:"ska, om arbetstagaren utan dröjsmål begär det"},
    {t:"Sick absence and holiday pay",sv:"Sjukfrånvaro",d:"Sick absence counts toward earned holiday pay if it totals no more than 180 days in the earning year, or if it results from a work injury.",s:"17 §",q:"om frånvaron under intjänandeåret inte överstiger 180 dagar"},
    {t:"Saving leave days",sv:"Spara semesterdagar",d:"If you have more than 20 paid leave days in a leave year, you may save the days above 20. Saved days must be taken within five years after the leave year they were saved.",s:"18 §",q:"får spara en eller flera sådana överskjutande dagar"},
    {t:"Holiday compensation",sv:"Semesterersättning",d:"If employment ends before earned holiday pay has been paid, you get holiday compensation instead. It is due without undue delay and within one month after employment ends.",s:"30 §",q:"senast en månad efter anställningens upphörande"}
  ],
  qs:[
    {q:"How many leave days does the law give an employee per leave year?",a:"25 days",w:["20 days","30 days","35 days"],e:"If employment starts after 31 August in the leave year, the right is five days instead.",s:"4 §",sv:"tjugofem semesterdagar varje semesterår"},
    {q:"By law, when does the leave year (semesterår) run?",a:"From 1 April to 31 March",w:["From 1 January to 31 December","From 1 May to 30 April","From 1 July to 30 June"],e:"The period just before it is the earning year (intjänandeår).",s:"3 §",sv:"från och med den 1 april ett år till och med den 31 mars påföljande år"},
    {q:"Unless otherwise agreed, which leave period must you be able to get in summer?",a:"At least four weeks in June to August",w:["At least two weeks in July","At least six weeks in May to September","One week in August"],e:"Leave may be scheduled at other times only for special reasons.",s:"12 §",sv:"minst fyra veckor under juni-augusti"},
    {q:"If the employer sets your leave dates, how far ahead must it tell you?",a:"Two months before",w:["One week","Two weeks","Six months"],e:"With special reasons the notice can be later, but if possible at least one month before.",s:"11 §",sv:"senast två månader före ledighetens början"},
    {q:"By law, how large is holiday pay under the percentage rule (procentregeln)?",a:"12 percent",w:["5 percent","8 percent","25 percent"],e:"The other method is the same-pay rule (sammalöneregeln, 16 a §). It adds a supplement per paid leave day, for example 0.43 percent of monthly pay for monthly-paid employees.",s:"16 b §",sv:null},
    {q:"Can your employer schedule your leave during your notice period without your consent?",a:"No, unless notice is over six months",w:["Yes, always","Yes, but only in summer","No, and there are no exceptions"],e:"Leave scheduled in a notice period needs your consent.",s:"14 §",sv:"Semesterledighet får inte utan arbetstagarens medgivande förläggas till uppsägningstid."},
    {q:"You fall sick on leave and tell your employer at once. What happens to the sick days?",a:"They do not count as leave days",w:["They count as leave days anyway","They are deducted from next year's leave","They count as half days"],e:"The remaining leave days are then taken together.",s:"15 §",sv:"ska, om arbetstagaren utan dröjsmål begär det"},
    {q:"Up to how many sick days a year still earn holiday pay?",a:"180 days",w:["30 days","90 days","365 days"],e:"Absence that results from a work injury also counts.",s:"17 §",sv:"om frånvaron under intjänandeåret inte överstiger 180 dagar"},
    {q:"Within how long must saved leave days be taken?",a:"Within five years",w:["Within one month","Within one year","They never expire"],e:"Only days above 20 paid leave days in a leave year can be saved.",s:"18 §",sv:"får spara en eller flera sådana överskjutande dagar"},
    {q:"Employment ends before earned holiday pay has been paid. By law, when is the holiday compensation due?",a:"Within one month",w:["Only at the start of the next leave year","Within one year","It is not paid"],e:"Holiday compensation (semesterersättning) replaces the holiday pay.",s:"30 §",sv:"senast en månad efter anställningens upphörande"},
    {q:"You start a new job on 1 October. How many leave days do you get in your first leave year?",a:"Five days",w:["25 days", "12 days", "None"],e:"If you start after 31 August in the leave year, you get five days.",s:"4 §",sv:null,eq:null},
    {q:"True or false: sick days during your leave always count as leave days.",a:"False",w:["True"],e:"If you ask without delay, the sick days do not count as leave days.",s:"15 §",sv:null,eq:null},
    {q:"Which statement about saved leave days is NOT correct?",a:"You can save any of your 25 days",w:["Only days above 20 can be saved", "Saved days must be taken within five years", "You cannot save days in a year when you take saved days"],e:"Only paid leave days above 20 can be saved, and they must be taken within five years.",s:"18 §",sv:null,eq:null},
    {q:"True or false: your leave can be placed in your notice period without your consent if the notice is longer than six months.",a:"True",w:["False"],e:"Leave may not be placed in notice time without your consent, except when the notice period is longer than six months.",s:"14 §",sv:null,eq:null}
  ]
},
{
  k:"DL",title:"Discrimination Act",full:"Discrimination Act",sfs:"2008:567",sv:"Diskrimineringslag",r:"diskrimineringslag-2008567_sfs-2008-567",svTo:"SFS 2025:736",en:EN_DL,
  intro:"The protected grounds, what counts as harassment, and protection when you speak up.",
  lesson:[
    {t:"Seven grounds",sv:"Diskrimineringsgrunder",d:"The Act protects against discrimination on seven grounds: sex, transgender identity or expression, ethnicity, religion or other belief, disability, sexual orientation and age.",s:"1 kap. 1 §",eq:"sex, transgender identity or expression, ethnicity, religion or other belief, disability, sexual orientation or age"},
    {t:"Harassment",sv:"Trakasserier",d:"Conduct that violates a person's dignity and is associated with a ground of discrimination.",s:"1 kap. 4 §",q:"ett uppträdande som kränker någons värdighet",eq:"conduct that violates a person's dignity and that is associated with one of the grounds of discrimination"},
    {t:"Employers",sv:"Arbetsgivare",d:"An employer may not discriminate against employees, job applicants, interns, or agency and hired workers.",s:"2 kap. 1 §",q:"En arbetsgivare får inte diskriminera den som hos arbetsgivaren",eq:"An employer may not discriminate against a person who, with respect to the employer, is an employee"},
    {t:"Reprisals",sv:"Repressalier",d:"An employer may not retaliate against an employee who reports a violation, takes part in an investigation, or rejects or gives in to harassment.",s:"2 kap. 18 §",q:"En arbetsgivare får inte utsätta en arbetstagare för repressalier",eq:"An employer may not subject an employee to reprisals because the employee has reported or called attention to the fact that the employer has acted contrary to this Act"},
    {t:"Diskrimineringsombudsmannen",sv:"Diskrimineringsombudsmannen",d:"DO supervises that the Act is followed.",s:"4 kap. 1 §",q:"Diskrimineringsombudsmannen ska utöva tillsyn över att denna lag följs",eq:"Diskrimineringsombudsmannen is to supervise compliance with this Act."},
    {t:"Indirect discrimination",sv:"Indirekt diskriminering",d:"A seemingly neutral rule or practice that puts people with a protected characteristic at a particular disadvantage. It is allowed only if it has a legitimate purpose and the means are appropriate and necessary.",s:"1 kap. 4 §",q:"som framstår som neutralt men som kan komma att särskilt missgynna",eq:"disadvantaged by the application of a provision, a criterion or a procedure that appears neutral"},
    {t:"Accessibility",sv:"Bristande tillgänglighet",d:"A person with a disability is disadvantaged because reasonable accessibility measures were not taken. Costs, practicality and the length of the relationship are considered.",s:"1 kap. 4 §",q:"åtgärder för tillgänglighet inte har vidtagits",eq:"a person with disability is disadvantaged through a failure to take measures for accessibility"},
    {t:"Duty to investigate",sv:"Utredningsskyldighet",d:"If an employer learns that an employee has been subjected to harassment or sexual harassment at work, it must investigate and take reasonable measures to prevent it happening again.",s:"2 kap. 3 §",q:"är arbetsgivaren skyldig att utreda omständigheterna",eq:"If an employer becomes aware that an employee considers that he or she has been subjected"},
    {t:"Active measures",sv:"Aktiva åtgärder",d:"Ongoing preventive and promotional work against discrimination. Employers with 25 or more employees must document it in writing. Employers with 10 to 24 employees document their pay survey.",s:"3 kap. 13 §",q:"sysselsatte 25 eller fler arbetstagare",eq:"Employers who employed 25 or more workers as of the beginning of the calendar year are to document in writing"},
    {t:"Compensation",sv:"Diskrimineringsersättning",d:"Anyone who breaks the prohibitions must pay compensation for the violation.",s:"5 kap. 1 §",q:"ska betala diskrimineringsersättning för den kränkning",eq:"shall pay compensation for discrimination for the offence resulting from the infringement"}
  ],
  qs:[
    {q:"How many grounds of discrimination does the Act list?",a:"Seven",w:["Three","Five","Nine"],e:"They are sex, transgender identity or expression, ethnicity, religion or other belief, disability, sexual orientation and age.",s:"1 kap. 1 §",sv:null,eq:"sex, transgender identity or expression, ethnicity, religion or other belief, disability, sexual orientation or age"},
    {q:"Which of these is one of the grounds in the Act?",a:"Religion or other belief",w:["Education level","Political opinion","Trade union membership"],e:"Education level, home town and club loyalty are not on the list.",s:"1 kap. 1 §",sv:null,eq:"sex, transgender identity or expression, ethnicity, religion or other belief, disability, sexual orientation or age"},
    {q:"How does the Act define harassment (trakasserier)?",a:"Conduct that violates dignity and links to a ground",w:["Any disagreement between colleagues","A manager giving a negative performance review","Being asked to work overtime"],e:"Sexual harassment is conduct of a sexual nature that violates a person's dignity.",s:"1 kap. 4 §",sv:"ett uppträdande som kränker någons värdighet",eq:"conduct that violates a person's dignity and that is associated with one of the grounds of discrimination"},
    {q:"You report that your employer has broken the Act. May the employer retaliate?",a:"No, reprisals are banned",w:["Yes, if the manager disagrees","Yes, but only in your first year","Yes, any report can be answered with a warning"],e:"The ban also covers taking part in an investigation, and rejecting or giving in to harassment.",s:"2 kap. 18 §",sv:"En arbetsgivare får inte utsätta en arbetstagare för repressalier",eq:"An employer may not subject an employee to reprisals because the employee has reported or called attention to the fact that the employer has acted contrary to this Act"},
    {q:"Which authority supervises that the Discrimination Act is followed?",a:"Diskrimineringsombudsmannen",w:["Arbetsmiljöverket","Försäkringskassan","Skatteverket"],e:"DO first tries to get those covered to comply voluntarily. Arbetsmiljöverket supervises the Work Environment Act.",s:"4 kap. 1 §",sv:"Diskrimineringsombudsmannen ska utöva tillsyn över att denna lag följs",eq:"Diskrimineringsombudsmannen is to supervise compliance with this Act."},
    {q:"What is indirect discrimination?",a:"A neutral-looking rule that hurts a protected group",w:["Discrimination that is only said, never done","Discrimination by a colleague rather than a manager","Treating everyone exactly the same in all cases"],e:"It is allowed only if the rule has a legitimate purpose and the means are appropriate and necessary.",s:"1 kap. 4 §",sv:"som framstår som neutralt men som kan komma att särskilt missgynna",eq:"disadvantaged by the application of a provision, a criterion or a procedure that appears neutral"},
    {q:"An employer fails to make reasonable adjustments for a disabled person. What is that?",a:"Discrimination",w:["Harassment","A reprisal","Only a matter for the building owner"],e:"Costs, practicality and the length of the relationship are considered.",s:"1 kap. 4 §",sv:"åtgärder för tillgänglighet inte har vidtagits",eq:"a person with disability is disadvantaged through a failure to take measures for accessibility"},
    {q:"An employee tells the employer they were harassed at work. What must the employer do?",a:"Investigate and take measures to stop it",w:["Wait to see if it happens again","Leave it to the employee to sort out","Report it to Arbetsmiljöverket and do nothing else"],e:"The duty applies when the employer learns that an employee considers they were subjected to harassment or sexual harassment.",s:"2 kap. 3 §",sv:"är arbetsgivaren skyldig att utreda omständigheterna",eq:"If an employer becomes aware that an employee considers that he or she has been subjected"},
    {q:"Employers with at least how many employees must document their active measures in writing?",a:"25 employees",w:["5 employees","10 employees","100 employees"],e:"Employers with 10 to 24 employees must document their pay survey in writing.",s:"3 kap. 13 §",sv:"sysselsatte 25 eller fler arbetstagare",eq:"Employers who employed 25 or more workers as of the beginning of the calendar year are to document in writing"},
    {q:"What must someone who breaks the discrimination prohibitions pay?",a:"Discrimination compensation",w:["Nothing unless the employee resigns","A fine to the Diskrimineringsombudsmannen only","Only the employee's lost wages"],e:"Deterring future violations is a key consideration.",s:"5 kap. 1 §",sv:"ska betala diskrimineringsersättning för den kränkning",eq:"shall pay compensation for discrimination for the offence resulting from the infringement"},
    {q:"A job ad asks for an employee \"under 30\". What could this be?",a:"Age discrimination",w:["Harassment", "A reprisal", "Nothing, ads are free"],e:"Age is one of the seven grounds. An employer may not discriminate against job applicants.",s:"2 kap. 1 §",sv:null,eq:null},
    {q:"True or false: an employer with 15 employees must write down its active measures every year.",a:"False",w:["True"],e:"The duty to document active measures starts at 25 employees. Employers with 10 to 24 employees document their pay survey.",s:"3 kap. 13 §",sv:null,eq:null},
    {q:"Which of these is a form of discrimination in the Act?",a:"Instructions to discriminate",w:["Fair criticism of poor work", "A pay rise given to everyone", "A change of office"],e:"The Act lists direct and indirect discrimination, inaccessibility, harassment, sexual harassment and instructions to discriminate.",s:"1 kap. 4 §",sv:null,eq:null},
    {q:"True or false: job applicants are protected from discrimination by the employer.",a:"True",w:["False"],e:"The employer may not discriminate against employees, job applicants, interns or hired-in workers.",s:"2 kap. 1 §",sv:null,eq:null}
  ]
},
{
  k:"FTL",title:"Trade Union Representatives Act",full:"Trade Union Representatives (Status at the Workplace) Act",sfs:"1974:358",sv:"Lag om facklig förtroendemans ställning på arbetsplatsen",r:"lag-1974358-om-facklig-fortroendemans-stallning_sfs-1974-358",svTo:"SFS 2022:837",en:null,
  intro:"The rights of the person your union appoints to speak for staff at your workplace.",
  lesson:[
    {t:"Who is covered",sv:"Facklig förtroendeman",d:"A representative appointed by a union to represent employees at a workplace. The Act applies once the union has notified the employer.",s:"1 §",q:"facklig förtroendeman företräda de anställda"},
    {t:"No obstruction",sv:"Hindra",d:"An employer may not hinder a representative. At another workplace the representative gets access if work is not significantly disrupted. Space must be provided at their own workplace.",s:"3 §",q:"En arbetsgivare får inte hindra en facklig förtroendeman"},
    {t:"No worse conditions",sv:"Försämrade arbetsförhållanden",d:"A representative may not get worse working conditions because of the assignment. After it ends, they keep an equal or comparable position.",s:"4 §",q:"får ej med anledning av sitt uppdrag ges försämrade arbetsförhållanden"},
    {t:"Notice of changes",sv:"Varsel",d:"Before changing a representative's conditions, the employer must give the local union at least two weeks' notice.",s:"5 §",q:"minst två veckor i förväg varsla den lokala arbetstagarorganisationen"},
    {t:"Time off",sv:"Ledighet",d:"A representative may take the leave the union duties require. It must be reasonable. Scope and timing are agreed with the local union.",s:"6 §",q:"rätt till den ledighet som fordras för det fackliga uppdraget"},
    {t:"Keep your benefits",sv:"Anställningsförmåner",d:"Leave for union work at the representative's own workplace keeps their employment benefits.",s:"7 §",q:"rätt till bibehållna anställningsförmåner"},
    {t:"Redundancy priority",sv:"Företräde",d:"In redundancies or temporary lay-offs, a representative can get priority to keep working if that is of special importance for union activity.",s:"8 §",q:"företräde till fortsatt arbete, om det är av särskild betydelse"},
    {t:"Agreements cannot cut rights",sv:"Ogiltigt",d:"An agreement that reduces a representative's rights under the Act is void. Certain sections can be adjusted by agreements at central union level.",s:"2 §",q:"rättigheter enligt denna lag inskränks är ogiltigt"},
    {t:"Disputed termination",sv:"Anställningen består",d:"If a representative disputes a termination and it matters greatly to union activity, employment continues until the dispute is settled. Suspension is barred without special reasons.",s:"8 a §",q:"upphör inte förtroendemannens anställning till följd av uppsägningen"},
    {t:"Damages",sv:"Skadestånd",d:"An employer that breaches the Act owes damages on top of pay and benefits (10 §). A damages claim must be notified within four months from when the damage occurred.",s:"11 §",q:"inom fyra månader från det skadan inträffade"}
  ],
  qs:[
    {q:"Who appoints a facklig förtroendeman covered by the Act?",a:"A trade union",w:["The employer","Arbetsmiljöverket","The Riksdag"],e:"The Act applies once the union has notified the employer of the appointment.",s:"1 §",sv:"facklig förtroendeman företräda de anställda"},
    {q:"May an employer obstruct a union representative in carrying out their duties?",a:"No, that is not allowed",w:["Yes, if the manager disagrees with the union","Yes, during the first year","Yes, whenever production is busy"],e:"At another workplace, the representative gets access as long as work is not significantly disrupted.",s:"3 §",sv:"En arbetsgivare får inte hindra en facklig förtroendeman"},
    {q:"Can a union representative be given worse working conditions because of the union assignment?",a:"No, that is not allowed",w:["Yes, if the employer pays extra","Yes, after one year in the role","Yes, if the union agrees in writing"],e:"After the assignment ends, they keep an equal or comparable position.",s:"4 §",sv:"får ej med anledning av sitt uppdrag ges försämrade arbetsförhållanden"},
    {q:"What does the Act say about time off for union duties?",a:"The leave the duties need, within reason",w:["No time off is allowed during working hours","Only unpaid holiday days may be used","Only the employer decides, case by case"],e:"The leave must not seriously disrupt work. Scope and timing are agreed with the local union.",s:"6 §",sv:"rätt till den ledighet som fordras för det fackliga uppdraget"},
    {q:"By law, what extra protection can a union representative have in a redundancy?",a:"Priority to keep working",w:["A higher salary","Double notice pay in every case","Exemption from all termination rules"],e:"A termination that breaks this rule can be declared void.",s:"8 §",sv:"företräde till fortsatt arbete, om det är av särskild betydelse"},
    {q:"By law, how much notice must an employer give the local union before changing a representative's working conditions?",a:"At least two weeks",w:["One day","At least six months","No notice is needed"],e:"Consultation can be requested, and the change waits until it has taken place.",s:"5 §",sv:"minst två veckor i förväg varsla den lokala arbetstagarorganisationen"},
    {q:"A representative takes leave for union work at their own workplace. By law, what happens to their employment benefits?",a:"They keep them",w:["They lose them for those days","They are halved","Only the union pays them"],e:"If the employer moves the union activity outside working hours, work-related pay is preserved.",s:"7 §",sv:"rätt till bibehållna anställningsförmåner"},
    {q:"A representative disputes their termination. Can employment continue during the dispute?",a:"Yes, if it matters greatly to the union",w:["No, employment always ends at once","Only if the employer agrees","Only for the first week"],e:"Suspension is barred without special reasons, and courts can intervene.",s:"8 a §",sv:"upphör inte förtroendemannens anställning till följd av uppsägningen"},
    {q:"Within how long must a damages claim under the Act be notified?",a:"Within four months",w:["Within four days","Within two years","Within ten years"],e:"A suit must follow within four months of ending any negotiation, or otherwise within eight months.",s:"11 §",sv:"inom fyra månader från det skadan inträffade"},
    {q:"A representative signs an individual agreement that reduces their rights under the Act. Is it valid?",a:"No, it is void to that extent",w:["Yes, because they signed it","Yes, if the manager asks","Yes, for the first year"],e:"Certain sections can be adjusted by agreements at central union level.",s:"2 §",sv:"rättigheter enligt denna lag inskränks är ogiltigt"},
    {q:"True or false: by law, after notice of a change, the employer must wait if the representative asks for consultation within one week.",a:"True",w:["False"],e:"The union or representative can request consultation within one week. The employer may not carry out the change until it has taken place.",s:"5 §",sv:null,eq:null},
    {q:"Which statement about the Act is NOT correct?",a:"It covers unions with no agreement",w:["It covers representatives appointed by a union", "The union must be bound by a collective agreement", "It applies once the union has told the employer"],e:"The Act covers representatives of a union that is bound by a collective agreement.",s:"1 §",sv:null,eq:null},
    {q:"True or false: a representative who disputes their termination can never keep working during the dispute.",a:"False",w:["True"],e:"If it matters greatly to union activity, employment continues until the dispute is settled.",s:"8 a §",sv:null,eq:null},
    {q:"If no negotiation was requested, within how long must a damages lawsuit be filed under the Act?",a:"Eight months",w:["Two months", "One year", "Four years"],e:"A claim must first be notified within four months. Without negotiation, the lawsuit must be filed within eight months of the harm.",s:"11 §",sv:null,eq:null}
  ]
}
];

var GLOSS=[
