 {sc:"Your workplace has a collective agreement. Your employer announces a reorganisation that changes your team. You ask the local union when they should have been involved.",q:"When must the employer open negotiations?",a:"As early as possible, before any decision is made",w:["Once the change has started and staff have noticed", "Only if the employees ask for it in writing", "About one month after the decision is taken"],e:"The employer must call for negotiation before major changes, early enough that the union can influence the outcome.",p:0,sv:"i så god tid som möjligt och innan denne har fattat beslut om förändringen",law:"11 §",ca:"The duty to negotiate applies where the employer is bound by a collective agreement."},
 {sc:"Your workplace has a collective agreement. The employer says it does not need to negotiate a new pay system with the union.",q:"Is the employer right?",a:"No, matters under the Act must be negotiated",w:["Yes, pay systems can never be negotiated", "Yes, as long as the staff say they agree", "Yes, unless the union's central office asks for it"],e:"This applies where there is a collective agreement. The union can call for negotiation.",p:1,sv:"Allt som faller under medbestämmandelagen (MBL) är arbetsgivaren skyldig att förhandla om.",law:null,ca:"The duty applies where the employer has a collective agreement."},
 {sc:"The negotiation ends without agreement. The employer goes ahead with its own plan.",q:"Can a court overrule the employer's decision?",a:"No, the substance cannot be tried in court",w:["Yes, the Labour Court always decides who was right", "Yes, if the union appeals within one week", "Yes, Arbetsmiljöverket decides who was right"],e:"The employer can decide after negotiating.",p:0,sv:"Man kan inte gå till domstol eller annan instans för att få själva sakfrågan prövad.",law:null},
 {sc:"You are the union rep and you want to request a negotiation on a planned change.",q:"What is the recommended way to ask for a negotiation?",a:"Make it in writing (förhandlingsframställan)",w:["Mention the wish casually in the coffee room", "Wait until the employer calls and asks you to", "Ask your manager to pass it on by text message"],e:"A written request makes things clear. Unions offer a template for this.",p:0,sv:null,law:null},
 {sc:"You are the union rep. The negotiation is over and the protocol is signed.",q:"What should you do about time limits?",a:"Contact the regional office so no limit expires",w:["Nothing, since there are no time limits of any kind", "Wait six months and then ask what applies", "Only act if the employer contacts you first"],e:"Union advice warns that limitation periods (preskriptionsfrister) can expire.",p:0,sv:null,law:null},
    {sc:"Your workplace has a collective agreement. On Monday your employer announces: \"The decision is made. We merge two teams from 1 January.\"",q:"Has the employer followed the negotiation rules?",a:"No, it must negotiate before deciding",w:["Yes, an announcement is enough", "Yes, if staff are told a month ahead", "No, it must ask each employee to vote"],e:"Before deciding on important changes, the employer must call for negotiation as early as possible. The decision must wait until the primary negotiations are done.",p:0,sv:null,law:"11 §",ca:"The duty to negotiate applies where the employer is bound by a collective agreement."},
    {sc:"Continued: the union and the employer negotiate but do not agree.",q:"Who has the final word?",a:"The employer, after negotiating",w:["The union, since it did not agree", "A court, which decides the substance", "The union's central office"],e:"If there is no agreement, the employer can generally decide as it presented in the negotiation. The substance cannot be tried in court.",p:0,sv:null,law:null,cont:true},
    {sc:"You are the union rep. The employer calls you to a negotiation about a reorganisation.",q:"What should the employer present?",a:"The plan and any alternatives",w:["Only the final decision", "Only the cost savings", "Nothing until after the decision"],e:"The employer should present the planned change and alternatives and give you time to think and discuss the proposal. A meeting for union members can be held if needed.",p:0,sv:null,law:null}
  ]},
{k:"AML",intro:"Unsafe workplaces and who to tell. The answers are based on advice from Swedish trade unions.",
 src:[["Arbetsmiljö",UN+"om-arbetsmiljo"],["Begäran om arbetsmiljöåtgärder (6:6a)",UN+"begaran-om-arbetsmiljoatgarder-66a"],["Arbetsmiljö",LO+"arbetsmiljo"]],
 qs:[
 {sc:"A cable across a corridor has caused near-falls for weeks.",q:"Who should you go to first?",a:"Your closest manager",w:["Arbetsmiljöverket directly", "The Labour Court", "Nobody, it is not your job"],e:"Union advice says to go to your closest manager first with a work environment problem.",p:0,sv:"Om du upplever problem i arbetsmiljön ska du i första hand vända dig till din närmaste chef.",law:null},
 {sc:"You told your manager about the cable weeks ago. Nothing has happened.",q:"What can you do next?",a:"Go to your safety representative",w:["Fix the problem yourself and say nothing", "Wait another year and hope it solves itself", "Resign from your job right away"],e:"If your manager takes no action, you can go to the safety representative. Your local union can also advise.",p:0,sv:null,law:null},
 {sc:"You slip and nearly fall. You are not hurt.",q:"What do you do?",a:"Tell your manager right away",w:["Say nothing, because nobody was hurt this time", "Report it yourself to Arbetsmiljöverket and tell no one else", "Wait until it happens again before you tell anyone"],e:"A near-accident is called tillbud. Tell your manager so it can be dealt with. If it posed a serious danger to life or health, the employer must report it to Arbetsmiljöverket without delay.",p:1,sv:null,law:"3 kap. 3 a §"},
 {sc:"As safety representative, you have asked for measures (6 kap. 6 a §).",q:"How fast should the employer answer?",a:"Without delay, within a reasonable time",w:["Within 24 hours of receiving the request", "Within one year of receiving the request", "The employer does not have to answer at all"],e:"The law sets no number of days. The employer must confirm receipt in writing right away and answer without delay. Unions often see about 14 days as reasonable. If nothing happens within a reasonable time, you can ask Arbetsmiljöverket to step in.",p:1,sv:"utan dröjsmål",law:"6 kap. 6 a §"},
 {sc:"You are a safety representative. A machine is leaking gas and there is an immediate, serious danger to life.",q:"What can you do?",a:"Stop the work, telling the employer if time allows",w:["Write a report and hand it in on Monday", "Ask the employer for a written permit first", "Nothing, because only Arbetsmiljöverket can stop work"],e:"Under 6 kap. 7 § a safety representative can stop work that involves immediate, serious danger.",p:1,sv:"omedelbar, allvarlig fara",law:"6 kap. 7 §"},
    {sc:"Your workplace has four employees and nobody has been appointed as safety representative. A machine guard is broken.",q:"Does the law require a safety representative here?",a:"No, only from five employees",w:["Yes, every workplace needs one", "Yes, from two workers", "Only if the employer agrees"],e:"A skyddsombud is required from five regularly employed workers. You can still raise the problem with your manager.",p:0,sv:null,law:"6 kap. 2 §",ca:"A local union with a collective agreement appoints the safety representative."},
    {sc:"Continued: you told your manager. Nothing happens, and there is no local union.",q:"Whom can you contact?",a:"Your trade union's legal advisers",w:["Nobody, you must just wait it out", "Your employer's own lawyer", "A journalist at a local paper"],e:"Without a safety representative or local union, your trade union's advisers can tell you what to do next, for example about contacting Arbetsmiljöverket.",p:2,sv:null,law:null,cont:true},
    {sc:"Your workplace has a digital system for reporting near-misses (tillbud).",q:"When should you use it?",a:"For every near-miss",w:["Only after someone is injured", "Only if the manager asks you to", "Never, the manager reports everything"],e:"Report near-misses to your manager right away. Many workplaces have digital systems for this.",p:0,sv:null,law:null}
  ]},
{k:"SEM",intro:"Planning, changing and cancelling leave. The answers are based on advice from Swedish trade unions.",
 src:[["Så kan du ta ut din semester",UN+"ta-ut-din-semester"],["Att avbryta eller ändra semestern",UN+"att-avbryta-eller-andra-semestern"],["Allt du behöver veta om semester",SI+"semester/"]],
 qs:[
 {sc:"You want four weeks in a row in July. You and your manager cannot agree on the timing.",q:"Who decides when you take your leave?",a:"The employer, if you cannot agree",w:["You decide alone, because it is your leave", "The union decides on your behalf", "Nobody, and you lose the leave"],e:"You have the right to four consecutive weeks between June and August. Timing is up to the employer if you cannot agree.",p:0,sv:"är det arbetsgivaren som bestämmer över förläggningen av semestern",law:"12 §"},
 {sc:"Your leave starts Monday. On Friday your manager orders you to cancel it because of an unforeseen crisis.",q:"Can you refuse?",a:"No, but the employer needs very strong reasons",w:["Yes, you may always refuse an order like that", "Yes, but only if you have already paid for a trip", "No, and the employer does not need any reason"],e:"Strong reasons mean something unforeseen that the whole company depends on. If there are none, you can ask your local union. If there is no local union, ask your trade union's legal advisers.",p:1,sv:"Du kan inte neka om din chef beordrar dig att avbryta din semester.",law:null},
 {sc:"Your leave is cancelled by the employer. You had a prepaid trip.",q:"What can you expect?",a:"Your days back and your extra costs covered",w:["Double pay as compensation for the trouble", "Nothing at all, since the employer decided", "Only the leave days back, but never the costs"],e:"You are not entitled to extra compensation for being called in, but you should get your costs covered.",p:1,sv:null,law:null},
 {sc:"The employer closes the workplace over Christmas. You have no paid leave days left.",q:"Can you be forced to take unpaid or saved leave?",a:"No, you get work or paid time off",w:["Yes, unpaid leave is allowed over holidays", "Yes, your saved days are used up first", "Yes, if you are told a week in advance"],e:"You can say no to unpaid leave days (8 §), and saved days are taken in the year you choose unless you agree otherwise (20 §). If you are available but get no work, the employer generally still has to pay you.",p:0,sv:null,law:"8 §"},
 {sc:"A friend says you get four weeks of holiday. You check the Annual Leave Act.",q:"How much leave per leave year and how much must be in summer?",a:"Five weeks, four of them in a row in June–August",w:["Four weeks, all of them in the summer", "Six weeks, with three of them taken in the summer", "Five weeks, all of them in July"],e:"Collective agreements and employment contracts can give more days.",p:0,sv:"fyra veckors sammanhängande semester under juni – augusti",law:null,ca:"A collective agreement or contract can give more days or different timing."},
    {sc:"You fall ill on the third day of your planned leave and tell your employer at once.",q:"Do the sick days count as leave days?",a:"No, if you report them right away",w:["Yes, sick days always count as leave", "Only if you have a medical certificate", "Only in the first week"],e:"Sick days do not count as leave days if you report them without delay. Unused days are usually rescheduled.",p:2,sv:null,law:"15 §"},
    {sc:"Continued: you are sick for nine days in a row.",q:"What does your employer expect?",a:"A medical certificate",w:["Nothing, leave rules cover it", "A letter from your union", "A note from a colleague"],e:"A medical certificate is needed for absences over seven days.",p:2,sv:null,law:null,cont:true},
    {sc:"Your manager phones you on holiday and asks you to answer work emails.",q:"Do you have to?",a:"No, you do not have to be reachable",w:["Yes, managers can always call you", "Yes, but only in the evening", "Yes, if the email is short"],e:"You have the right to be fully free from work during leave and need not be reachable or on standby.",p:2,sv:null,law:null}
  ]},
{k:"DL",intro:"Harassment and discrimination: what you do and what the employer must do. The answers are based on advice from Swedish trade unions.",
 src:[["Råd om du känner dig trakasserad",UN+"rad-om-du-kanner-dig-trakasserad"],["Diskriminering på jobbet och ansvar",UN+"diskriminering-pa-jobbet"]],
 qs:[
 {sc:"A colleague keeps making jokes about your gender. You feel offended.",q:"If you feel it is possible, what is a good first step?",a:"Say clearly that you feel offended",w:["Laugh along and hope that it stops by itself", "Report it to the police at once", "Wait six months to see if it continues"],e:"You decide whether you feel harassed. Harassment can be physical, verbal or non-verbal.",p:0,sv:"säg ifrån direkt när du känner dig kränkt",law:null},
 {sc:"The jokes continue. You decide to keep notes.",q:"What should you write down?",a:"What happened, when, and any witnesses",w:["Only how you felt about it afterwards", "Only the name of the colleague involved", "Nothing, because notes are never useful"],e:"Union advice is to note what happened, when, and whether there were witnesses.",p:0,sv:null,law:null},
 {sc:"You tell your manager about the harassment.",q:"What must the employer do?",a:"Investigate and take measures to stop it",w:["Wait for you to repeat the complaint a second time", "Move you to another team and consider it settled", "Do nothing unless there is hard proof"],e:"Under the Discrimination Act the employer must investigate to find out what happened and what must be done to stop it.",p:0,sv:null,law:"2 kap. 3 §"},
 {sc:"You want support from your union at work.",q:"What can your union representative ask of the employer?",a:"To negotiate and demand measures",w:["To have the colleague fired the same day", "To pay you a fine as compensation", "Nothing, since a union rep cannot act in such cases"],e:"Your local union, workplace rep or work environment rep can support and, if needed, represent you.",p:0,sv:null,law:null,ca:"The union's right to negotiate rests on the collective agreement."},
 {sc:"The employer promises measures after the investigation.",q:"How do you make sure the measures actually work?",a:"Ask for minutes and agree on a follow-up",w:["Trust that it will work and say no more", "Wait a year and then see what has happened", "Drop the matter once the employer has promised measures"],e:"A follow-up shows whether the harassment has really stopped.",p:0,sv:null,law:null},
    {sc:"A colleague posts a joke in the team chat about people of your ethnicity. You feel hurt.",q:"Who decides whether it is offensive?",a:"The person who feels hurt",w:["The colleague who posted it", "The manager alone", "A majority of the team"],e:"Whether something is offensive is up to the person affected.",p:1,sv:null,law:null},
    {sc:"Continued: you tell your employer.",q:"What should the employer have in place?",a:"An anti-harassment policy",w:["A rule that complaints wait a month", "A list of colleagues who may joke", "Nothing, it is up to staff"],e:"The employer must adopt a policy against harassment and discrimination and set up routines for handling incidents.",p:1,sv:null,law:null,cont:true},
    {sc:"Your probationary employment ends right after you tell your employer you are pregnant.",q:"What might this be?",a:"Discrimination",w:["Nothing, probation can end any time", "An inspection by the union", "A routine pay review"],e:"Ending a probationary employment after a pregnancy is announced is an example of discrimination. Contact your union.",p:1,sv:null,law:null}
  ]},
{k:"FTL",intro:"Rights of a union representative at work. The answers are based on advice from Swedish trade unions.",
 src:[["Tid för fackligt arbete",UN+"facklig-tid"]],
 qs:[
 {sc:"You have just been elected union representative at your workplace.",q:"Which conditions apply for paid union time under the law?",a:"An agreement, an election and notice",w:["Only that you are a member of the union", "Only that your manager approves of the union", "Only that you work full time at the workplace"],e:"Union advice lists these four conditions for paid union time under the Förtroendemannalagen.",p:0,sv:null,law:null,ca:"Paid union time under the law depends on a collective agreement."},
 {sc:"You wonder how many hours a week you may spend on union work.",q:"How much union time are you entitled to?",a:"What you need, with no fixed limit",w:["Exactly eight hours every week for every rep", "Never more than one hour per week", "As much as you like, without any limit"],e:"The law gives the leave the duties need, as long as it is reasonable for the workplace. Scope and timing are agreed with the local union (6 §). Smaller workplaces generally need less.",p:0,sv:"Det finns inga fasta mallar eller nyckeltal för att bedöma vilken ledighet som kan vara tillräcklig.",law:null},
 {sc:"You want to attend a union course.",q:"What are you entitled to?",a:"Leave for a course relevant to your role",w:["No right to any leave for courses at all", "Unpaid leave only, whatever the course", "Leave only if the employer arranges the course itself"],e:"A course marked F lets you attend with pay maintained under the Förtroendemannalagen.",p:0,sv:null,law:null},
 {sc:"Your workplace has no collective agreement. You were elected as union rep anyway.",q:"Do you have the same right to paid union time?",a:"No, a collective agreement is required",w:["Yes, the law always gives it to every rep", "Yes, if you ask your manager politely", "Yes, but only for half of the time"],e:"Ask your local union what other support is available. If there is no local union, ask your trade union's legal advisers.",p:0,sv:null,law:null,ca:"No collective agreement means the Act's paid union time does not apply in the same way."},
 {sc:"You are newly elected and unsure how to arrange your union time with the employer.",q:"What is a sensible way to start?",a:"Learn the role and agree how to meet the employer",w:["Wait until the employer asks you to start", "Skip the training, since it is not needed", "Do all your union work outside your working hours"],e:"Unions offer an action-plan template for arranging union time.",p:0,sv:null,law:null},
    {sc:"Your workplace has a collective agreement. You are the union representative and want to book a negotiation meeting during work hours.",q:"Is preparing and holding negotiations paid union time?",a:"Yes, it is paid union time",w:["No, only courses are paid", "No, only meetings after work", "Yes, but only once a year"],e:"Preparing and holding negotiations, board meetings and meetings for union members are paid union activities.",p:0,sv:null,law:null,ca:"Paid union time under the law depends on a collective agreement."},
    {sc:"Continued: you want to agree how union time is organised.",q:"When should you agree the structure with the employer?",a:"Early, ideally right away",w:["After the first dispute", "Only when the employer asks", "Once a year"],e:"Set the structure for meetings and union time with the employer from the start. An action-plan template can help.",p:0,sv:null,law:null,cont:true},
    {sc:"Your workplace has a collective agreement. You are the union representative. Your union offers an F-marked course related to your role.",q:"How is your pay handled during the course?",a:"You keep your pay",w:["Unpaid leave only", "Paid by the union only", "You use your leave days"],e:"F-marked courses are attended with retained pay under the representatives' law.",p:0,sv:null,law:null,ca:"Paid union time under the law depends on a collective agreement."}
  ]}
];

al cannot set the Act aside", "w": ["Yes, if you both sign it in writing first", "Yes, as long as every extra hour is paid", "Yes, but only for employees over 25 years old"], "e": "Only a collective agreement can depart from the Working Hours Act, not a deal between you and your employer. General overtime is capped at 200 hours a year (8 §).", "k": "ATL", "law": "3 §", "sc": "There is no collective agreement. Your manager says: \"Let's sign a deal, just you and me, so you can work 300 hours of overtime this year.\""}, {"q": "How long can that deal apply?", "a": "At most one month", "w": ["At most one year", "Until the union cancels it", "As long as both sides want"], "e": "A local agreement may depart from the overtime rules (8 and 8 a §§) for at most one month. Longer changes need an agreement made or approved by a central union.", "k": "ATL", "law": "3 §", "sc": "A local union and the employer agree to allow more overtime than the Act does. No central union has approved it."}, {"q": "Can a collective agreement take away your daily rest entirely?", "a": "No, it must still meet the EU minimum", "w": ["Yes, an agreement can set any rules", "Yes, if the local union agrees to it", "Yes, if the employer pays extra for it"], "e": "An agreement may change the rest rules, but not so that you get less protection than the EU Working Time Directive gives. A term like that is void.", "k": "ATL", "law": "3 §"}, {"q": "Your workplace has a collective agreement. How far ahead must you be told about changes to your hours?", "a": "As the agreement says; it can replace the two weeks", "w": ["Always exactly two weeks, no matter what the agreement says", "Always at least one month in advance, by law", "Never, since the agreement removes the rule entirely"], "e": "The Act says at least two weeks (12 §). An agreement made or approved by a central union can change this, but must keep the EU directive's overall protection.", "k": "ATL", "law": "3 §"}, {"q": "Without a collective agreement, who can allow an employer exceptions from rules such as weekly rest?", "a": "Arbetsmiljöverket, for special reasons", "w": ["The employer alone, if business is busy", "Any employee who agrees to it in writing", "The local municipality's labour office"], "e": "If a collective agreement cannot be made, Arbetsmiljöverket can allow exceptions from certain rules, such as weekly rest, when there are special reasons.", "k": "ATL", "law": "19 §"}]}, {"title": "Pay, leave and benefits", "intro": "Much of what people think of as standard comes from collective agreements, not from law.", "rows": [["Minimum pay", "None set by law", "Some agreements set one"], ["Yearly pay review", "Only if your contract says so", "Usually every year"], ["Occupational pension", "Not required by law", "The employer pays into it"], ["Insurance if injured or ill", "Not required by law", "Usually included"], ["Holiday pay", "The law's rules (SEM 16 a, 16 b §§)", "Can be replaced (SEM 2 a §)"]], "qs": [{"q": "Is there a minimum wage set by law in Sweden?", "a": "No, but some collective agreements set one", "w": ["Yes, the Working Hours Act sets one for all", "Yes, the government sets a new one every year", "Yes, but only for workers under 25 years old"], "e": "Sweden has no minimum wage set by law. Some collective agreements contain minimum pay rules. Without an agreement, your pay is what you agree in your contract.", "src": "MW"}, {"q": "Is that allowed?", "a": "Yes, no law requires an occupational pension", "w": ["No, the Annual Leave Act requires one to be paid", "No, every employer must pay one under the law", "No, the union can fine the employer for it"], "e": "An occupational pension (tjänstepension) usually comes through a collective agreement. Without one, it depends on your contract. You still get the state pension.", "src": "DTP", "sc": "Your workplace has no collective agreement. Your employer pays no occupational pension (tjänstepension)."}, {"q": "What happens to your pension?", "a": "The employer starts paying into a pension", "w": ["Nothing changes until you ask the employer", "You must start paying the pension yourself", "The state raises your state pension instead"], "e": "With a collective agreement, the employer puts money into your occupational pension every year.", "src": "DTP", "sc": "Continued: the employer signs a collective agreement.", "cont": true}, {"q": "Which insurance usually comes with a collective agreement?", "a": "Insurance if you are injured or fall ill", "w": ["Home insurance for your flat or your house", "Car insurance for driving to and from work", "Travel insurance for your holidays abroad"], "e": "Collective agreements usually include insurance that pays out if you are injured at work or fall ill for a long time. Without an agreement, check whether your employer offers anything similar.", "src": "DTP"}, {"q": "How is your holiday pay calculated?", "a": "As the agreement says; it can replace the law", "w": ["Always 12 percent of last year's earned pay", "Always your normal pay, with no supplement at all", "Your manager decides it each summer, case by case"], "e": "The Act has two methods: the same-pay rule and the 12 percent rule (16 a and 16 b §§). An agreement made or approved by a central union can replace them.", "k": "SEM", "law": "2 a §", "sc": "Your workplace has a collective agreement."}, {"q": "Under the Act's same-pay rule (sammalöneregeln), what do you get for each holiday day on top of normal pay?", "a": "0.43 percent of your monthly pay", "w": ["0.8 percent of your monthly pay", "12 percent of your monthly pay", "Nothing extra on top of your normal pay"], "e": "Under the same-pay rule you keep your normal monthly pay and get a holiday supplement of 0.43 percent of it for each paid holiday day. A collective agreement can set something different.", "k": "SEM", "law": "16 a §", "sc": "Your workplace has no collective agreement. You have a fixed monthly salary."}, {"q": "Do you have a right to a yearly pay review?", "a": "Only if your contract says so", "w": ["Yes, the law requires one every spring", "Yes, after 12 months of employment", "No, pay can never change without one"], "e": "No law requires a yearly pay review. With a collective agreement, your pay is usually reviewed every year. Without one, it depends on your contract and what you negotiate.", "src": "DTP", "sc": "Your workplace has no collective agreement."}, {"q": "Which of these do you usually get only through a collective agreement?", "a": "Extra parental pay on top of parental benefit", "w": ["The right to take parental leave itself", "25 days of paid annual leave every year", "Protection against discrimination at your workplace"], "e": "Parental leave, annual leave and protection against discrimination come from law. Extra parental pay (föräldralön) on top of the state's parental benefit usually comes through a collective agreement.", "src": "DTP"}]}, {"title": "Termination and redundancy", "intro": "Notice periods, who goes first and who must be involved, with and without an agreement.", "rows": [["Notice period", "1–6 months by length of employment (LAS 11 §)", "Can be different (LAS 2 b §)"], ["Who goes first", "Last in, first out, up to three exemptions (LAS 22 §)", "Often an agreed list (LAS 2 b §)"], ["Union told before a personal-reasons termination", "Yes, if you are a member (LAS 30 §)", "Yes, if you are a member (LAS 30 §)"], ["Who the employer negotiates redundancies with", "All unions with members affected (MBL 13 §)", "The union it has the agreement with (MBL 11 §)"], ["Support after redundancy", "Check what is available", "A transition fund, such as Trygghetsrådet"]], "qs": [{"q": "What is your minimum notice period?", "a": "Three months", "w": ["One month", "Two months", "Six months"], "e": "By law, the notice period is three months after at least four years of employment.", "k": "LAS", "law": "11 §", "sc": "Your workplace has no collective agreement. You have worked there for five years and are terminated because of redundancy."}, {"q": "Can your notice period be different?", "a": "Yes, the agreement can change it", "w": ["No, the law's periods always apply", "Only if you agree to it in writing", "Only if you are under 25 years old"], "e": "A collective agreement made or approved by a central union can depart from the notice rules in 11 §.", "k": "LAS", "law": "2 b §", "sc": "Continued: the workplace has a collective agreement approved by a central union.", "cont": true}, {"q": "Without a collective agreement, what is the main rule for who is terminated first in a redundancy?", "a": "Last in, first out, with up to three exemptions", "w": ["The employer chooses freely who has to go", "The oldest employees are terminated first", "Those with the lowest pay are terminated first"], "e": "Shorter total employment goes first. The employer may exempt up to three people it considers of special importance.", "k": "LAS", "law": "22 §"}, {"q": "With a collective agreement, how is the order of termination often set?", "a": "In a list the employer and union agree on", "w": ["Always strictly last in, first out", "By a vote among all the employees", "By Arbetsförmedlingen, the employment service"], "e": "A collective agreement can replace the law's order of termination, for example with a list agreed between the employer and the union (turordningslista). The order is also set per collective agreement area (22 §).", "k": "LAS", "law": "2 b §"}, {"q": "Can a local union agreement change what counts as sakliga skäl (objective grounds) for termination?", "a": "No, only an agreement at the very top level", "w": ["Yes, any local agreement can change that", "Yes, if a majority of employees vote for it", "No, and no agreement of any kind ever can"], "e": "Only an agreement where the employee side is a federation of central unions can depart from the objective-grounds rule in 7 §.", "k": "LAS", "law": "2 c §"}, {"q": "Must the employer tell your union?", "a": "Yes, your membership is what counts", "w": ["No, only where there is an agreement", "No, the employer never has to", "Only if you ask the employer to"], "e": "If you are a union member, the employer must notify the local union at the same time as it gives you advance notice. This does not depend on a collective agreement.", "k": "LAS", "law": "30 §", "sc": "You are a union member. Your workplace has no collective agreement. The employer wants to terminate you for personal reasons."}, {"q": "Whom must the employer negotiate with first?", "a": "All unions with members affected", "w": ["Nobody, since there is no agreement", "Only the largest union in Sweden", "Only Arbetsförmedlingen"], "e": "An employer with no collective agreement at all must negotiate with all affected unions before redundancies.", "k": "MBL", "law": "13 §", "sc": "An employer with no collective agreement at all plans redundancies."}, {"q": "With a collective agreement, who often offers support such as coaching after a redundancy?", "a": "A transition fund, such as Trygghetsrådet", "w": ["The Working Hours Act's own support fund", "The Swedish Tax Agency's support office", "Nobody, such support does not exist at all"], "e": "Union advice: with a collective agreement, you can get help from a transition fund such as Trygghetsrådet if you lose your job through redundancy.", "src": "DTP"}]}, {"title": "Union rights and negotiation", "intro": "What the union may do, and what the employer must do, with and without an agreement.", "rows": [["Negotiation before big changes", "On matters that especially affect members (MBL 13 §)", "Always with the agreement union (MBL 11 §)"], ["Information about the business", "To unions with members there (MBL 19 a §)", "To the agreement union, with a right to see documents (MBL 19 §)"], ["Strikes", "Possible, within the law's rules", "Peace obligation while the agreement applies (MBL 41 §)"], ["Union representatives' rights", "The Act does not apply (FTL 1 §)", "Paid union time and protection (FTL)"], ["Who appoints the skyddsombud", "The employees (AML 6 kap. 2 §)", "The local union (AML 6 kap. 2 §)"]], "qs": [{"q": "What must it do before deciding?", "a": "Negotiate with the union first", "w": ["Inform the staff after the decision", "Ask Arbetsmiljöverket for permission", "Nothing, it is the employer's call"], "e": "An employer bound by a collective agreement must negotiate with that union before major changes.", "k": "MBL", "law": "11 §", "sc": "Your employer has a collective agreement and plans to close your department."}, {"q": "Must that employer negotiate before deciding?", "a": "Yes, on matters that especially affect members", "w": ["No, never without a collective agreement", "Only if every single employee is a member", "Only if the decision is about pay or hours"], "e": "Without a collective agreement, the employer must still negotiate with a union on matters that especially affect its members. On redundancies, it must negotiate with all affected unions.", "k": "MBL", "law": "13 §", "sc": "Continued: another employer has no collective agreement and plans the same. Some staff are union members.", "cont": true}, {"q": "Must it keep their union informed about how the business is doing?", "a": "Yes, unions with members there", "w": ["No, only where there is an agreement", "Only if it is on the stock exchange", "Only once, when the business starts"], "e": "An employer without a collective agreement must keep unions that have members among its staff informed. With an agreement, the duty is to that union and includes a right to see documents (19 §).", "k": "MBL", "law": "19 a §", "sc": "Your employer has no collective agreement, but several staff are union members."}, {"q": "May the union go on strike over it?", "a": "No, the peace obligation stops it", "w": ["Yes, at any time the union likes", "Yes, after giving a one-week warning", "Yes, if a majority votes for it"], "e": "While bound by a collective agreement, the parties may not take industrial action over a dispute about how the agreement should be read.", "k": "MBL", "law": "41 §", "sc": "Your workplace has a collective agreement. The union and employer disagree about how it should be read."}, {"q": "Can a union use industrial action to get an agreement?", "a": "Yes, within the rules of the law", "w": ["No, strikes are banned in Sweden", "No, only the employer may act", "Only after a court order"], "e": "The peace obligation only binds parties to a collective agreement. A union can take industrial action to get one, within the limits the Act sets.", "k": "MBL", "law": "41 §", "sc": "Continued: a different employer has no collective agreement at all.", "cont": true}, {"q": "Does the Trade Union Representatives Act protect you?", "a": "No, it covers unions bound by an agreement", "w": ["Yes, it covers representatives of every union", "Yes, once you tell the employer about it", "Only if you work full time at the workplace"], "e": "The Act covers representatives of a union that is, or usually is, bound by a collective agreement with the employer.", "k": "FTL", "law": "1 §", "sc": "You are a union representative. Your union has no collective agreement with your employer and does not usually have one."}, {"q": "At a workplace with no union bound by a collective agreement, who appoints the safety representative (skyddsombud)?", "a": "The employees themselves", "w": ["The employer", "Arbetsmiljöverket", "The nearest union office"], "e": "A local union that is, or usually is, bound by a collective agreement appoints the skyddsombud. If there is none, the employees appoint one.", "k": "AML", "law": "6 kap. 2 §"}, {"q": "Before letting an outside company do work your colleagues normally do, what must an employer with a collective agreement do?", "a": "Negotiate with the union before deciding", "w": ["Inform the outside company's own staff", "Get approval from the local municipality", "Nothing, as long as the company is Swedish"], "e": "An employer bound by a collective agreement must negotiate with that union before having work done by people who are not its employees, with some exceptions.", "k": "MBL", "law": "38 §"}]}, {"title": "What never changes", "intro": "The floor: rights that apply with or without an agreement, and that no agreement can take away.", "rows": [["25 days of paid annual leave", "Yes (SEM 4 §)", "Yes, an agreement cannot cut it"], ["Protection against discrimination", "Yes (DL)", "Yes, and unfair agreement terms can be set aside"], ["Right to join a union", "Yes (MBL 7–8 §§)", "Yes"], ["A safe work environment", "Yes (AML 3 kap. 2 §)", "Yes"], ["A private deal that cuts your rights", "Void (LAS 2 a §)", "Void"]], "qs": [{"q": "Can a collective agreement cut your paid annual leave below 25 days?", "a": "No, 25 days is the minimum", "w": ["Yes, down to 20 days", "Yes, to any number of days", "Only for part-time staff"], "e": "Everyone gets 25 days of leave per leave year (4 §). Agreements can give more, but 4 § is not among the rules an agreement may change.", "k": "SEM", "law": "2 a §"}, {"q": "Your employer has no collective agreement. Does the Discrimination Act still protect you?", "a": "Yes, it applies at every workplace", "w": ["No, only where there is an agreement", "Only if you are a union member", "Only at public sector employers"], "e": "The Discrimination Act applies whether or not there is an agreement. A discriminatory term in a collective agreement can even be changed or declared invalid.", "k": "DL", "law": "5 kap. 3 §"}, {"q": "Can a collective agreement take away your right to join a union?", "a": "No, that right cannot be limited", "w": ["Yes, if the employer asks for it", "Yes, but only for managers", "Only at small companies"], "e": "The right to organise (föreningsrätt) must be left untouched. No agreement can limit it.", "k": "MBL", "law": "8 §"}, {"q": "Does your employer's duty to prevent illness and accidents depend on a collective agreement?", "a": "No, every employer has this duty", "w": ["Yes, only with an agreement", "Only with more than five staff", "Only in factories and other industry"], "e": "The employer must take all measures needed to prevent illness and accidents at work. This applies at every workplace.", "k": "AML", "law": "3 kap. 2 §"}, {"q": "Does the right to stop the work still apply?", "a": "Yes, it does not depend on an agreement", "w": ["No, the right needs a collective agreement", "Only with the employer's approval", "Only if Arbetsmiljöverket is there"], "e": "A skyddsombud may stop work that poses an immediate and serious danger. The rule does not require a collective agreement.", "k": "AML", "law": "6 kap. 7 §", "sc": "Your workplace has no collective agreement. The safety representative (skyddsombud) sees work that poses an immediate, serious danger."}, {"q": "Is that valid?", "a": "No, a private deal cutting your rights is void", "w": ["Yes, if you signed it of your own free will", "Yes, as long as you got a bonus for signing", "Yes, once you have been employed six months"], "e": "An agreement that removes or limits your rights under the Employment Protection Act is void, unless the Act allows it. Only some collective agreements can change these rules.", "k": "LAS", "law": "2 a §", "sc": "Your contract says you give up the notice period in the Employment Protection Act."}, {"q": "Which of these is a floor that no collective agreement can go below?", "a": "Your 25 days of paid annual leave", "w": ["The overtime caps in the Working Hours Act", "Two weeks' notice of schedule changes", "The last-in, first-out order"], "e": "An agreement can change the overtime caps, the notice of schedule changes and the order of termination. It cannot cut the 25 days of annual leave (SEM 4 §).", "k": "SEM", "law": "2 a §"}, {"q": "Can a collective agreement give you better terms than the law?", "a": "Yes, agreements often give more", "w": ["No, the law sets the maximum", "Only for pay, never for leave", "Only if Arbetsmiljöverket agrees"], "e": "The laws set minimum protection. Agreements and contracts can give more, for example extra leave days or pay on top of what the law requires.", "src": "DTP"}]}];

var NUMW={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,fifty:50};
function numOf(s){
  var m=s.match(/(\d{1,2}):(\d{2})/);if(m){return {v:+m[1]*60+(+m[2]),u:"time"};}
  m=s.match(/(\d+(?:[.,]\d+)?)\s*(percent|%|[a-zåäö]+)?/i);
  if(m){return {v:parseFloat(m[1].replace(",",".")),u:(m[2]||"").toLowerCase()};}
  m=s.toLowerCase().match(/\b(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|fifty)\b\s*([a-zåäö]+)?/);
  if(m){return {v:NUMW[m[1]],u:(m[2]||"")};}
  return null;
}
function unitKey(u){u=u.replace(/s$/,"");if(u==="%"){u="percent";}if(u==="worker"||u==="employee"){u="person";}return u;}
function whyWrong(q,pick,right){
  var P=pick.trim(),C=right.trim();
  if(/^(true|false)$/i.test(P)){return 'The statement is '+C.toLowerCase()+'.';}
  if(/\bNOT\b/.test(q.q)){return 'That statement is correct, so it is not the answer.';}
  var g=GLOSS.filter(function(x){return x[0].toLowerCase()===P.toLowerCase();})[0];
  if(g){return '<span lang="sv">'+g[0]+'</span> means “'+g[1]+'”.';}
  if(/^(yes|no)\b/i.test(P)||/^(yes|no)\b/i.test(C)){return '';}
  if(/\d\s*(to|–|-)\s*\d/.test(P)||/\d\s*(to|–|-)\s*\d/.test(C)){return '';}
  var a=numOf(P),b=numOf(C);
  if(a&&b&&a.v!==b.v&&(a.u==="time"?b.u==="time":(unitKey(a.u)===unitKey(b.u)||!a.u||!b.u))){
    if(a.u==="time"){return 'That is too '+(a.v<b.v?'early':'late')+'.';}
    return 'That is too '+(a.v<b.v?'low':'high')+'.';
  }
  return '';
}

  else if(a==="union"){S.u={};go("union");}
  else if(a==="ue"){S.u={e:+b.getAttribute("data-i")};go("union");}
  else if(a==="uw"){S.u.w=+b.getAttribute("data-i");go("union");}
  else if(a==="ui"){S.u.i=+b.getAttribute("data-i");go("union");}
  else if(a==="uback"){var U=S.u;if(U.i!=null){U.i=null;if(U.auto){U.auto=false;U.w=null;}}else if(U.w!=null){U.w=null;}else{U.e=null;}go("union");}
  else if(a==="ureset"){S.u={};go("union");}
  else if(a==="help"){S.hs=null;go("help");}
  else if(a==="hsit"){var hi=parseInt(b.getAttribute("data-i"),10);S.hs=hi<0?null:hi;go("help");}
  else if(a==="start"||a==="retry"){S.practice=false;startRun();go("quiz");}
  else if(a==="retrymiss"){var ms=S.run.filter(function(r){return r.p!=null&&!r.o[r.p].c;}).map(function(r){return r.q;});if(!ms.length){return;}S.practice=true;startRun(ms);go("quiz");}
  else if(a==="leave"){if((S.qi===0&&S.picked==null)||S.leaveArm){go("home");}else{S.leaveArm=true;render();}}
  else if(a==="reset"){if(S.resetArm){P={best:[null,null,null,null,null,null,null],best2:[null,null,null,null,null,null,null],best3:[null,null,null,null,null,null,null],best4:[null,null,null,null,null]};save();S.resetArm=false;render();}else{S.resetArm=true;render();var rb=app.querySelector('[data-act="reset"]');if(rb){rb.focus();}}}
  else if(a==="gk"){var k=b.getAttribute("data-k");S.gk=(S.gk===k)?null:k;app.querySelectorAll('.chips button').forEach(function(c){c.setAttribute("aria-pressed",String(c.getAttribute("data-k")===S.gk));});glossFilter();}
  else if(a==="gjump"){var L=b.getAttribute("data-l"),hit=null;app.querySelectorAll('.gl').forEach(function(g){if(!hit&&!g.hidden&&g.getAttribute("data-l")===L){hit=g;}});if(hit){hit.scrollIntoView({block:"start",behavior:"smooth"});}}
  else if(a==="ckclear"){CK={};try{localStorage.setItem("lsdswe.checks","{}");}catch(e5){}render();}
  else if(a==="glossq"){S.back="quiz";go("gloss");}
  else if(a==="backquiz"){S.back=null;go("quiz");}
  else if(a==="pick"){
    if(S.picked!=null){return;}
    var i=parseInt(b.getAttribute("data-i"),10);
    S.leaveArm=false;S.picked=i;S.run[S.qi].p=i;S.marks[S.qi]=S.run[S.qi].o[i].c;render();
    var f=document.getElementById("fb");if(f){f.scrollIntoView({block:"nearest",behavior:"smooth"});try{f.focus({preventScroll:true});}catch(e3){}}
  }
  else if(a==="next"){
    if(S.qi<S.run.length-1){S.qi++;S.picked=null;go("quiz");}
    else{
      if(S.practice){go("result");return;}
      var sc=S.marks.filter(Boolean).length;
      var arr=bestArr();var before=unlocked();var prev=arr[S.m];arr[S.m]=prev==null?sc:Math.max(prev,sc);save();S.unl=(S.ch===1&&!before&&unlocked());
      go("result");
    }
  }
  else if(a==="sizecycle"){SZ=(SZ+1)%3;applySize();try{localStorage.setItem("arbetsratt101.size",String(SZ));}catch(e4){}render();var nb=app.querySelector('[data-act="sizecycle"]');if(nb){nb.focus();}}
  else if(a==="size"){SZ=parseInt(b.getAttribute("data-i"),10);applySize();try{localStorage.setItem("arbetsratt101.size",String(SZ));}catch(e2){}render();}
  else if(a==="nextmod"){S.unl=false;S.m=Math.min(S.m+1,(S.ch===4?ACTS4:ACTS).length-1);go("lesson");}
});

document.addEventListener("keydown",function(e){
  if(S.view!=="quiz"||e.ctrlKey||e.metaKey||e.altKey){return;}
  var k=e.key.toLowerCase();var i="1234".indexOf(k);if(i<0){i="abcd".indexOf(k);}
  if(S.picked==null&&i>=0&&i<4){var bt=app.querySelectorAll('[data-act="pick"]')[i];if(bt){e.preventDefault();bt.click();}}
  else if(S.picked!=null&&(k==="n"||k==="arrowright")){var nx=dockin.querySelector('[data-act="next"]');if(nx){e.preventDefault();nx.click();}}
});
render();
})();
</script>
